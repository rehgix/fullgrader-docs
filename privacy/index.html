er fotografare i fogli delle verifiche e correggerli.</p>\n<p>Può inoltre richiedere l’accesso alle tue <strong>foto</strong>, esclusivamente se scegli di inserire il logo della tua scuola nei modelli. Se non utilizzi questa funzione, puoi negare l’autorizzazione senza che nulla smetta di funzionare.</p>\n<p>Non viene richiesto l’accesso a contatti, posizione, microfono, calendario né ad alcun altro dato del dispositivo.</p>\n<h2>Come eliminare le tue informazioni</h2>\n<p>All’interno dell’app puoi eliminare in qualsiasi momento classi, studenti, verifiche e singoli fogli corretti. E se vuoi eliminare assolutamente tutto, basta disinstallare FullGrader: così facendo, il sistema operativo cancella il database e le foto insieme all’applicazione, senza lasciare traccia.</p>\n<p>Poiché non ci sono server, non c’è nulla da richiedere né alcuna procedura da seguire per ottenere la cancellazione delle tue informazioni: se ne vanno con te.</p>\n<h2>Minori</h2>\n<p>FullGrader è uno strumento destinato ai docenti, non agli studenti. Sebbene possa contenere nomi di minori inseriti dal docente, l’app non è pensata per essere utilizzata da minori né raccoglie di per sé informazioni su di loro.</p>\n<h2>Modifiche alla presente informativa</h2>\n<p>Se in futuro FullGrader introdurrà funzioni che modifichino quanto sopra, questa pagina verrà aggiornata e la data indicata all’inizio verrà modificata. Se la modifica fosse rilevante, ne verrà dato avviso anche all’interno dell’applicazione.</p>\n<h2>Contatti</h2>\n<p>Per qualsiasi domanda sulla presente informativa o sul trattamento dei dati in FullGrader, puoi scrivere a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. Troverai anche un collegamento diretto per scriverci nella sezione Impostazioni dell’app.</p>", "footer": "© 2026 FullGrader. Tutti i diritti riservati."}, "pt": {"label": "Português", "title": "Política de privacidade", "updated": "Última atualização: 8 de outubro de 2026", "lead": "<strong>O FullGrader não recolhe quaisquer dados.</strong> Todas as informações que introduz — as suas turmas, os seus alunos, os seus modelos de teste e as folhas corrigidas, incluindo as fotografias — ficam guardadas apenas no seu próprio dispositivo. A aplicação não tem servidores, não tem contas de utilizador e não envia nada para a Internet. As únicas exceções são opcionais e só acontecem se o pedir: ler do Google Classroom os nomes dos seus alunos e enviar para o Google Classroom as notas de um teste (explicado mais abaixo). E, se decidir subscrever o FullGrader Premium, o pagamento é gerido pelo Google Play (explicado mais abaixo).", "body": "<h2>Que informações a aplicação utiliza</h2>\n<p>O FullGrader guarda no seu telemóvel ou tablet aquilo que introduz: os nomes das suas turmas, os nomes e os códigos de quatro dígitos dos seus alunos, os modelos de teste que cria, as respostas certas e o resultado de cada folha corrigida com a respetiva nota.</p>\n<p>Tudo isso fica numa base de dados dentro do armazenamento privado da aplicação, ao qual nenhuma outra aplicação do dispositivo tem acesso. Nós também não: não existe nenhuma cópia em nenhum lugar que não seja o seu dispositivo.</p>\n<h2>A câmara e as fotografias dos testes</h2>\n<p>Para corrigir uma folha, o FullGrader precisa de lhe tirar uma fotografia. Essa fotografia é analisada no próprio dispositivo: o reconhecimento das opções assinaladas é feito pela aplicação, sem ligação à Internet e sem intervenção de nenhum serviço externo.</p>\n<p>A fotografia é guardada juntamente com o resultado para que a possa rever mais tarde e corrigir à mão qualquer resposta que tenha sido mal lida. Fica no armazenamento privado da aplicação e não é carregada para a Internet, não é guardada na sua galeria nem é partilhada com ninguém.</p>\n<p>A aplicação também pode pedir-lhe acesso às suas fotografias, mas apenas se decidir colocar o logótipo da sua escola nas folhas impressas. Nesse caso, só é utilizada a imagem que escolher, e exclusivamente para a desenhar nos modelos.</p>\n<h2>Os dados dos seus alunos</h2>\n<p>Ao usar o FullGrader, introduz nomes de alunos que, na maioria dos casos, são menores de idade. Convém que fique claro como isto funciona.</p>\n<p>Essas informações nunca chegam a quem desenvolve o FullGrader nem a terceiros: ficam no seu dispositivo, tal como se as tivesse escrito num caderno ou numa folha de cálculo guardada no seu computador. A aplicação é a ferramenta; os dados continuam a ser seus e da sua escola.</p>\n<p>Isso também significa que a responsabilidade por esses dados continua a ser do professor e do estabelecimento de ensino, no âmbito das normas de proteção de dados que lhes sejam aplicáveis. Recomendamos que proteja o dispositivo com código ou impressão digital, como faria com qualquer documento com as notas dos seus alunos.</p>\n<h2>Cópias de segurança e exportações</h2>\n<p>O FullGrader permite-lhe criar uma cópia de segurança com todas as suas informações e exportar as notas de um teste para um ficheiro que pode abrir no Excel. Também gera as folhas de teste em PDF para as imprimir.</p>\n<p>Esses ficheiros são gerados por si e é o próprio que decide o que fazer com eles: guardá-los, enviá-los por e-mail ou carregá-los para o seu serviço de armazenamento na nuvem. A partir do momento em que sai da aplicação com um desses ficheiros, a sua guarda passa a depender do sítio onde o guardar. O FullGrader não intervém nesse processo nem conserva cópia de nada.</p>\n<h2>Importar a lista do Google Classroom (opcional)</h2>\n<p>Se tocar em «Importar do Google Classroom», a aplicação pede-lhe que inicie sessão com a sua conta Google e pede-lhe duas autorizações <strong>só de leitura</strong>: ver as suas turmas do Classroom e ver as respetivas listas de alunos. Com elas, o FullGrader transfere diretamente da Google para o seu dispositivo a lista das suas turmas e o nome e o apelido dos alunos da turma que escolher. Não são lidos e-mails, notas, trabalhos nem quaisquer outros dados e, ao importar, a aplicação não envia à Google nem a ninguém qualquer informação sua ou dos seus alunos.</p>\n<p>Tudo acontece entre o seu dispositivo e a Google: essas informações não passam por nenhum servidor nosso (não temos nenhum) e só são utilizadas para adicionar esses alunos à turma do FullGrader que escolher. No fim, a aplicação termina a sessão da Google e não guarda a sua conta nem o seu acesso. Pode retirar a autorização quando quiser em <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>A utilização que o FullGrader faz das informações recebidas das API da Google cumpre a <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Política de Dados do Utilizador dos Serviços de API da Google</a>, incluindo os requisitos de utilização limitada.</p>\n<h2>Enviar as notas para o Google Classroom (opcional)</h2>\n<p>A partir de um teste, pode tocar em «Enviar notas para o Classroom». É opcional, nunca é ativado sozinho e só acontece se o pedir e confirmar de cada vez. Para isso, a aplicação pede-lhe que inicie sessão com a sua conta Google e, além das duas autorizações de leitura indicadas acima, <strong>mais uma autorização</strong>: criar trabalhos e lançar notas nas suas turmas do Classroom.</p>\n<p>Esta é a única funcionalidade em que informações dos seus alunos saem do seu dispositivo. O que é enviado para a Google é o título da prova, a respetiva nota máxima e a nota de cada aluno, que é lançada na entrega desse aluno no Classroom. Para saber que aluno é qual, a aplicação compara, dentro do seu dispositivo, o nome e o apelido da sua lista com os da turma do Classroom; os nomes da sua lista não são enviados. Não são enviadas fotografias, respostas nem quaisquer outros dados.</p>\n<p>A aplicação cria um trabalho novo na turma que escolher (os alunos vão vê-lo aparecer no Classroom) e deixa as notas como rascunho: os alunos não as veem até que as devolva a partir do Classroom, e a aplicação nunca as devolve por iniciativa própria. Para poder atualizar essas notas mais tarde sem criar outro trabalho, a aplicação guarda no seu dispositivo que turma e que trabalho do Classroom foram utilizados. No fim, termina a sessão da Google e não guarda a sua conta nem o seu acesso. Pode retirar a autorização quando quiser em <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Tudo acontece entre o seu dispositivo e a Google, sem passar por nenhum servidor nosso (não temos nenhum). Uma vez no Classroom, as notas ficam na sua turma, associadas à sua conta e sujeitas às condições da Google e da sua escola.</p>\n<h2>Subscrição FullGrader Premium (opcional)</h2><p>O FullGrader tem uma subscrição opcional, o FullGrader Premium. Se decidir subscrevê-la, o pagamento é processado pelo <strong>Google Play</strong>, com a sua conta Google na loja. O FullGrader não recebe nem guarda o seu cartão, os seus dados de pagamento nem a sua identidade: recebe apenas do Google Play, no seu próprio dispositivo, a indicação de se tem a subscrição ativa.</p><p>Para isso, a aplicação guarda no seu dispositivo se o Premium está ativo e a data da última verificação, bem como quantas avaliações guardou este mês (para aplicar o limite da versão gratuita). Esse contador não é incluído nas cópias de segurança nem sai do dispositivo. A gestão da subscrição, o cancelamento e os reembolsos são feitos no Google Play e regem-se pelas respetivas condições.</p><h2>O que o FullGrader não faz</h2>\n<p>Não há contas de utilizador nem registo: não lhe pedimos e-mail, nem telefone, nem nada parecido. Não há publicidade de nenhum tipo. Não há sistemas de análise nem de rastreio: não medimos como usa a aplicação, nem quantas vezes a abre, nem a partir de onde. Não há componentes de terceiros que recolham informações em segundo plano. E não vendemos nem cedemos dados a ninguém, simplesmente porque não temos nenhuns.</p>\n<h2>Permissões que a aplicação pede</h2>\n<p>O FullGrader pede acesso à <strong>câmara</strong>, que é imprescindível para fotografar as folhas de teste e corrigi-las.</p>\n<p>E pode pedir acesso às suas <strong>fotografias</strong>, apenas se escolher colocar o logótipo da sua escola nos modelos. Se não usar essa funcionalidade, pode recusar a permissão sem que nada deixe de funcionar.</p>\n<p>Não é pedido acesso a contactos, localização, microfone, calendário nem a quaisquer outros dados do dispositivo.</p>\n<h2>Como eliminar as suas informações</h2>\n<p>Dentro da aplicação pode eliminar em qualquer momento turmas, alunos, testes e folhas corrigidas concretas. E se quiser eliminar absolutamente tudo, basta desinstalar o FullGrader: ao fazê-lo, o sistema operativo apaga a base de dados e as fotografias juntamente com a aplicação, sem deixar rasto.</p>\n<p>Como não há servidores, não há nada a pedir nem nenhum procedimento a seguir para que as suas informações sejam eliminadas: vão-se consigo.</p>\n<h2>Menores</h2>\n<p>O FullGrader é uma ferramenta destinada a professores, não a alunos. Embora contenha nomes de menores introduzidos pelo docente, a aplicação não foi pensada para ser usada por menores nem recolhe, por si própria, informações sobre eles.</p>\n<h2>Alterações a esta política</h2>\n<p>Se no futuro o FullGrader incorporar funcionalidades que alterem algo do que foi descrito acima, esta página será atualizada e a data no início será modificada. Se a alteração for importante, será também comunicada dentro da própria aplicação.</p>\n<h2>Contacto</h2>\n<p>Para qualquer dúvida sobre esta política ou sobre o tratamento de dados no FullGrader, pode escrever para <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. Também encontrará um acesso direto para nos escrever na secção Definições da aplicação.</p>", "footer": "© 2026 FullGrader. Todos os direitos reservados."}};
  var PAGEWORD = {"es": "Privacidad", "ca": "Privacitat", "gl": "Privacidade", "eu": "Pribatutasuna", "en": "Privacy", "de": "Datenschutz", "fr": "Confidentialité", "it": "Privacy", "pt": "Privacidade"};
  var ORDER = ["es", "ca", "gl", "eu", "en", "de", "fr", "it", "pt"];

  function pickInitialLang() {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get('lang');
    if (fromUrl && DATA[fromUrl]) return fromUrl;
    try {
      var saved = localStorage.getItem('fullgrader-home-lang');
      if (saved && DATA[saved]) return saved;
    } catch (e) {}
    var nav = (navigator.language || 'es').toLowerCase();
    for (var i = 0; i < ORDER.length; i++) {
      if (nav.indexOf(ORDER[i]) === 0) return ORDER[i];
    }
    return 'es';
  }

  function render(lang) {
    var d = DATA[lang];
    if (!d) return;
    document.documentElement.lang = lang;
    document.title = d.title + ' · FullGrader';
    document.getElementById('pTitle').textContent = d.title;
    document.getElementById('pUpdated').textContent = d.updated;
    document.getElementById('pLead').innerHTML = d.lead;
    document.getElementById('pBody').innerHTML = d.body;
    document.getElementById('pFooter').innerHTML = '<p>' + d.footer + '</p>';
    var pw = document.querySelector('[data-pageword]');
    if (pw) pw.textContent = PAGEWORD[lang];
    FGBar.sync(lang);
    try { localStorage.setItem('fullgrader-home-lang', lang); } catch (e) {}
  }

  FGBar.onChange(render);

  render(pickInitialLang());
</script>
