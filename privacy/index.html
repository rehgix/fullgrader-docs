<script>
  var DATA = {"es": {"label": "Español", "title": "Política de privacidad", "updated": "Última actualización: 8 de octubre de 2026", "lead": "<strong>FullGrader no recoge ningún dato.</strong> Toda la información que introduces —tus clases, tus alumnos, tus plantillas de examen y las hojas corregidas, incluidas las fotos— se guarda únicamente en tu propio dispositivo. La app no tiene servidores, no tiene cuentas de usuario y no envía nada a internet. Las únicas excepciones son opcionales y solo ocurren si tú lo pides: leer de Google Classroom los nombres de tus alumnos y enviar a Google Classroom las notas de un examen (se explica más abajo). Y si decides suscribirte a FullGrader Premium, el pago lo gestiona Google Play (se explica más abajo).", "body": "<h2>Qué información maneja la app</h2>\n<p>FullGrader guarda en tu móvil o tablet lo que tú introduces: los nombres de tus clases, los nombres y códigos de cuatro cifras de tus alumnos, las plantillas de examen que creas, las respuestas correctas, y el resultado de cada hoja corregida con su nota.</p>\n<p>Todo eso vive en una base de datos dentro del almacenamiento privado de la aplicación, al que ninguna otra app del dispositivo tiene acceso. Nosotros tampoco: no existe ninguna copia en ningún sitio que no sea tu dispositivo.</p>\n<h2>La cámara y las fotos de los exámenes</h2>\n<p>Para corregir una hoja, FullGrader necesita hacerle una foto. Esa foto se analiza en el propio dispositivo: el reconocimiento de las casillas marcadas lo hace la app, sin conexión y sin intervención de ningún servicio externo.</p>\n<p>La foto se guarda junto con el resultado para que puedas revisarla más tarde y corregir a mano cualquier respuesta que se haya leído mal. Se queda en el almacenamiento privado de la app y no se sube a internet, no se guarda en tu carrete ni se comparte con nadie.</p>\n<p>La app también puede pedirte acceso a tus fotos, pero únicamente si decides poner el logo de tu centro en las hojas impresas. En ese caso solo se utiliza la imagen que tú elijas, y se usa exclusivamente para dibujarla en las plantillas.</p>\n<h2>Los datos de tus alumnos</h2>\n<p>Al usar FullGrader introduces nombres de alumnos, que en la mayoría de los casos son menores de edad. Conviene que quede claro cómo funciona esto.</p>\n<p>Esa información no llega en ningún momento a quien desarrolla FullGrader ni a ningún tercero: se queda en tu dispositivo, igual que si la hubieras escrito en un cuaderno o en una hoja de cálculo guardada en tu ordenador. La app es la herramienta; los datos siguen siendo tuyos y de tu centro.</p>\n<p>Eso también significa que la responsabilidad sobre esos datos sigue siendo del profesor y del centro educativo, dentro de las normas de protección de datos que os apliquen. Te recomendamos proteger el dispositivo con código o huella, como harías con cualquier documento con notas de tus alumnos.</p>\n<h2>Copias de seguridad y exportaciones</h2>\n<p>FullGrader te permite crear una copia de seguridad con toda tu información, y exportar las notas de un examen a un archivo para abrirlo en Excel. También genera las hojas de examen en PDF para imprimirlas.</p>\n<p>Esos archivos los generas tú y decides tú qué hacer con ellos: guardarlos, enviarlos por correo o subirlos a tu servicio de almacenamiento en la nube. A partir del momento en que sales de la app con uno de esos archivos, su custodia pasa a depender de dónde lo guardes. FullGrader no interviene en ese proceso ni conserva copia de nada.</p>\n<h2>Importar la lista desde Google Classroom (opcional)</h2>\n<p>Si tocas «Importar desde Google Classroom», la app te pide iniciar sesión con tu cuenta de Google y te pide dos permisos de <strong>solo lectura</strong>: ver tus clases de Classroom y ver sus listas de alumnos. Con ellos, FullGrader descarga directamente de Google a tu dispositivo la lista de tus clases y el nombre y los apellidos de los alumnos de la clase que elijas. No se leen correos, notas, trabajos ni ningún otro dato, y al importar, la app no envía a Google ni a nadie ninguna información tuya ni de tus alumnos.</p>\n<p>Todo ocurre entre tu dispositivo y Google: esa información no pasa por ningún servidor nuestro (no tenemos ninguno) y solo se usa para añadir esos alumnos a la clase de FullGrader que tú elijas. Al terminar, la app cierra la sesión de Google y no guarda tu cuenta ni tu acceso. Puedes retirar el permiso cuando quieras en <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>El uso que hace FullGrader de la información recibida de las API de Google se ajusta a la <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Política de datos de usuario de los servicios de API de Google</a>, incluidos los requisitos de uso limitado.</p>\n<h2>Enviar las notas a Google Classroom (opcional)</h2>\n<p>Desde un examen puedes tocar «Enviar notas a Classroom». Es opcional, no se activa nunca por sí solo y solo ocurre si lo pides y lo confirmas cada vez. Para ello, la app te pide iniciar sesión con tu cuenta de Google y, además de los dos permisos de lectura de arriba, <strong>un permiso más</strong>: crear tareas y poner notas en tus clases de Classroom.</p>\n<p>Esta es la única función en la que información de tus alumnos sale de tu dispositivo. Lo que se envía a Google es el título de la prueba, su nota máxima y la nota de cada alumno, que se pone en la entrega de ese alumno en Classroom. Para saber qué alumno es cuál, la app compara, dentro de tu dispositivo, el nombre y los apellidos de tu lista con los de la clase de Classroom; los nombres de tu lista no se envían. No se envían fotos, respuestas ni ningún otro dato.</p>\n<p>La app crea una tarea nueva en la clase que elijas (los alumnos la verán aparecer en Classroom) y deja las notas como borrador: los alumnos no las ven hasta que tú las devuelves desde Classroom, y la app nunca las devuelve por su cuenta. Para poder actualizar esas notas más adelante sin crear otra tarea, la app guarda en tu dispositivo qué clase y qué tarea de Classroom se usaron. Al terminar, cierra la sesión de Google y no guarda tu cuenta ni tu acceso. Puedes retirar el permiso cuando quieras en <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Todo ocurre entre tu dispositivo y Google, sin pasar por ningún servidor nuestro (no tenemos ninguno). Una vez en Classroom, las notas quedan en tu clase, bajo tu cuenta y sujetas a las condiciones de Google y de tu centro.</p>\n<h2>Suscripción FullGrader Premium (opcional)</h2><p>FullGrader tiene una suscripción opcional, FullGrader Premium. Si decides contratarla, el pago lo procesa <strong>Google Play</strong>, con tu cuenta de Google en la tienda. FullGrader no recibe ni guarda tu tarjeta, tus datos de pago ni tu identidad: solo recibe de Google Play, en tu propio dispositivo, el aviso de si tienes la suscripción activa.</p><p>Para eso la app guarda en tu dispositivo si Premium está activo y la fecha de la última comprobación, y cuántas evaluaciones has guardado este mes (para aplicar el límite de la versión gratuita). Ese contador no entra en las copias de seguridad ni sale del dispositivo. La gestión de la suscripción, la cancelación y los reembolsos se hacen en Google Play y se rigen por sus condiciones.</p><h2>Lo que FullGrader no hace</h2>\n<p>No hay cuentas de usuario ni registro: no te pedimos correo, ni teléfono, ni nada parecido. No hay publicidad de ningún tipo. No hay sistemas de analítica ni de seguimiento: no medimos cómo usas la app, ni cuántas veces la abres, ni desde dónde. No hay componentes de terceros que recojan información en segundo plano. Y no vendemos ni cedemos datos a nadie, sencillamente porque no tenemos ninguno.</p>\n<h2>Permisos que pide la app</h2>\n<p>FullGrader solicita acceso a la <strong>cámara</strong>, que es imprescindible para fotografiar las hojas de examen y corregirlas.</p>\n<p>Y puede solicitar acceso a tus <strong>fotos</strong>, únicamente si eliges poner el logo de tu centro en las plantillas. Si no usas esa función, puedes denegar el permiso sin que nada deje de funcionar.</p>\n<p>No se pide acceso a contactos, ubicación, micrófono, calendario ni a ningún otro dato del dispositivo.</p>\n<h2>Cómo eliminar tu información</h2>\n<p>Dentro de la app puedes borrar en cualquier momento clases, alumnos, exámenes y hojas corregidas concretas. Y si quieres eliminarlo absolutamente todo, basta con desinstalar FullGrader: al hacerlo, el sistema operativo borra la base de datos y las fotos junto con la aplicación, sin dejar rastro.</p>\n<p>Como no hay servidores, no hay nada que solicitar ni ningún trámite que hacer para que se elimine tu información: se va contigo.</p>\n<h2>Menores</h2>\n<p>FullGrader es una herramienta dirigida a profesores, no a alumnos. Aunque contenga nombres de menores introducidos por el docente, la app no está pensada para que la usen menores ni recoge información de ellos por sí misma.</p>\n<h2>Cambios en esta política</h2>\n<p>Si en el futuro FullGrader incorpora funciones que cambien algo de lo anterior, esta página se actualizará y se modificará la fecha del principio. Si el cambio fuera importante, se avisará también dentro de la propia aplicación.</p>\n<h2>Contacto</h2>\n<p>Para cualquier duda sobre esta política o sobre el tratamiento de datos en FullGrader, puedes escribir a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. También encontrarás un acceso directo para escribirnos en la sección de Ajustes de la app.</p>", "footer": "© 2026 FullGrader. Todos los derechos reservados."}, "ca": {"label": "Català", "title": "Política de privacitat", "updated": "Última actualització: 8 d'octubre de 2026", "lead": "<strong>FullGrader no recull cap dada.</strong> Tota la informació que introdueixes —les teves classes, els teus alumnes, les teves plantilles d’examen i els fulls corregits, fotos incloses— es desa únicament al teu propi dispositiu. L’app no té servidors, no té comptes d’usuari i no envia res a internet. Les úniques excepcions són opcionals i només passen si tu ho demanes: llegir de Google Classroom els noms del teu alumnat i enviar a Google Classroom les notes d’un examen (s’explica més avall). I si decideixes subscriure't a FullGrader Premium, el pagament el gestiona Google Play (s'explica més avall).", "body": "<h2>Quina informació gestiona l’app</h2>\n<p>FullGrader desa al teu mòbil o tauleta allò que tu introdueixes: els noms de les teves classes, els noms i codis de quatre xifres dels teus alumnes, les plantilles d’examen que crees, les respostes correctes, i el resultat de cada full corregit amb la seva nota.</p>\n<p>Tot això viu en una base de dades dins l’emmagatzematge privat de l’aplicació, al qual cap altra app del dispositiu té accés. Nosaltres tampoc: no existeix cap còpia enlloc que no sigui el teu dispositiu.</p>\n<h2>La càmera i les fotos dels exàmens</h2>\n<p>Per corregir un full, FullGrader necessita fer-li una foto. Aquesta foto s’analitza al mateix dispositiu: el reconeixement de les caselles marcades el fa l’app, sense connexió i sense intervenció de cap servei extern.</p>\n<p>La foto es desa juntament amb el resultat perquè puguis revisar-la més tard i corregir a mà qualsevol resposta que s’hagi llegit malament. Es queda a l’emmagatzematge privat de l’app i no es puja a internet, no es desa al teu carret ni es comparteix amb ningú.</p>\n<p>L’app també et pot demanar accés a les teves fotos, però únicament si decideixes posar el logotip del teu centre als fulls impresos. En aquest cas només s’utilitza la imatge que tu triïs, i serveix exclusivament per dibuixar-la a les plantilles.</p>\n<h2>Les dades dels teus alumnes</h2>\n<p>En fer servir FullGrader introdueixes noms d’alumnes, que en la majoria de casos són menors d’edat. Convé que quedi clar com funciona això.</p>\n<p>Aquesta informació no arriba en cap moment a qui desenvolupa FullGrader ni a cap tercer: es queda al teu dispositiu, igual que si l’haguessis escrit en una llibreta o en un full de càlcul desat al teu ordinador. L’app és l’eina; les dades continuen sent teves i del teu centre.</p>\n<p>Això també significa que la responsabilitat sobre aquestes dades continua sent del professor i del centre educatiu, dins les normes de protecció de dades que us apliquin. Et recomanem protegir el dispositiu amb codi o empremta, com faries amb qualsevol document amb notes dels teus alumnes.</p>\n<h2>Còpies de seguretat i exportacions</h2>\n<p>FullGrader et permet crear una còpia de seguretat amb tota la teva informació, i exportar les notes d’un examen a un fitxer per obrir-lo amb l’Excel. També genera els fulls d’examen en PDF per imprimir-los.</p>\n<p>Aquests fitxers els generes tu i decideixes tu què fer-ne: desar-los, enviar-los per correu o pujar-los al teu servei d’emmagatzematge al núvol. A partir del moment en què surts de l’app amb un d’aquests fitxers, la seva custòdia depèn d’on el desis. FullGrader no intervé en aquest procés ni en conserva cap còpia.</p>\n<h2>Importar la llista des de Google Classroom (opcional)</h2>\n<p>Si toques «Importa des de Google Classroom», l’app et demana iniciar la sessió amb el teu compte de Google i et demana dos permisos de <strong>només lectura</strong>: veure les teves classes de Classroom i veure’n les llistes d’alumnes. Amb aquests permisos, FullGrader descarrega directament de Google al teu dispositiu la llista de les teves classes i el nom i els cognoms de l’alumnat de la classe que triïs. No es llegeixen correus, notes, treballs ni cap altra dada, i en importar, l’app no envia a Google ni a ningú cap informació teva ni del teu alumnat.</p>\n<p>Tot passa entre el teu dispositiu i Google: aquesta informació no passa per cap servidor nostre (no en tenim cap) i només s’utilitza per afegir aquests alumnes a la classe de FullGrader que triïs. En acabar, l’app tanca la sessió de Google i no desa el teu compte ni el teu accés. Pots retirar el permís quan vulguis a <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>L’ús que fa FullGrader de la informació rebuda de les API de Google s’ajusta a la <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Política de dades d’usuari dels serveis d’API de Google</a>, inclosos els requisits d’ús limitat.</p>\n<h2>Enviar les notes a Google Classroom (opcional)</h2>\n<p>Des d’un examen pots tocar «Envia les notes a Classroom». És opcional, no s’activa mai per si sol i només passa si ho demanes i ho confirmes cada vegada. Per a això, l’app et demana iniciar la sessió amb el teu compte de Google i, a més dels dos permisos de lectura d’abans, <strong>un permís més</strong>: crear tasques i posar notes a les teves classes de Classroom.</p>\n<p>Aquesta és l’única funció en què informació del teu alumnat surt del teu dispositiu. El que s’envia a Google és el títol de la prova, la seva nota màxima i la nota de cada alumne, que es posa al lliurament d’aquell alumne a Classroom. Per saber quin alumne és quin, l’app compara, dins del teu dispositiu, el nom i els cognoms de la teva llista amb els de la classe de Classroom; els noms de la teva llista no s’envien. No s’envien fotos, respostes ni cap altra dada.</p>\n<p>L’app crea una tasca nova a la classe que triïs (els alumnes la veuran aparèixer a Classroom) i deixa les notes com a esborrany: els alumnes no les veuen fins que tu les retornes des de Classroom, i l’app mai no les retorna pel seu compte. Per poder actualitzar aquestes notes més endavant sense crear una altra tasca, l’app desa al teu dispositiu quina classe i quina tasca de Classroom s’han fet servir. En acabar, tanca la sessió de Google i no desa el teu compte ni el teu accés. Pots retirar el permís quan vulguis a <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Tot passa entre el teu dispositiu i Google, sense passar per cap servidor nostre (no en tenim cap). Un cop a Classroom, les notes queden a la teva classe, sota el teu compte i subjectes a les condicions de Google i del teu centre.</p>\n<h2>Subscripció FullGrader Premium (opcional)</h2><p>FullGrader té una subscripció opcional, FullGrader Premium. Si decideixes contractar-la, el pagament el processa <strong>Google Play</strong>, amb el teu compte de Google a la botiga. FullGrader no rep ni desa la teva targeta, les teves dades de pagament ni la teva identitat: només rep de Google Play, al teu propi dispositiu, l'avís de si tens la subscripció activa.</p><p>Per a això l'app desa al teu dispositiu si Premium està actiu i la data de l'última comprovació, i quantes avaluacions has desat aquest mes (per aplicar el límit de la versió gratuïta). Aquest comptador no entra a les còpies de seguretat ni surt del dispositiu. La gestió de la subscripció, la cancel·lació i els reembossaments es fan a Google Play i es regeixen per les seves condicions.</p><h2>El que FullGrader no fa</h2>\n<p>No hi ha comptes d’usuari ni registre: no et demanem correu, ni telèfon, ni res semblant. No hi ha publicitat de cap mena. No hi ha sistemes d’analítica ni de seguiment: no mesurem com fas servir l’app, ni quantes vegades l’obres, ni des d’on. No hi ha components de tercers que recullin informació en segon pla. I no venem ni cedim dades a ningú, senzillament perquè no en tenim cap.</p>\n<h2>Permisos que demana l’app</h2>\n<p>FullGrader sol·licita accés a la <strong>càmera</strong>, que és imprescindible per fotografiar els fulls d’examen i corregir-los.</p>\n<p>I pot sol·licitar accés a les teves <strong>fotos</strong>, únicament si tries posar el logotip del teu centre a les plantilles. Si no fas servir aquesta funció, pots denegar el permís sense que res deixi de funcionar.</p>\n<p>No es demana accés a contactes, ubicació, micròfon, calendari ni a cap altra dada del dispositiu.</p>\n<h2>Com eliminar la teva informació</h2>\n<p>Dins l’app pots esborrar en qualsevol moment classes, alumnes, exàmens i fulls corregits concrets. I si vols eliminar-ho absolutament tot, n’hi ha prou amb desinstal·lar FullGrader: en fer-ho, el sistema operatiu esborra la base de dades i les fotos juntament amb l’aplicació, sense deixar rastre.</p>\n<p>Com que no hi ha servidors, no hi ha res a sol·licitar ni cap tràmit a fer perquè s’elimini la teva informació: se’n va amb tu.</p>\n<h2>Menors</h2>\n<p>FullGrader és una eina adreçada a professors, no a alumnes. Encara que contingui noms de menors introduïts pel docent, l’app no està pensada perquè la facin servir menors ni recull informació d’ells per si mateixa.</p>\n<h2>Canvis en aquesta política</h2>\n<p>Si en el futur FullGrader incorpora funcions que canviïn alguna cosa de l’anterior, aquesta pàgina s’actualitzarà i es modificarà la data del principi. Si el canvi fos important, s’avisarà també dins la mateixa aplicació.</p>\n<h2>Contacte</h2>\n<p>Per a qualsevol dubte sobre aquesta política o sobre el tractament de dades a FullGrader, pots escriure a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. També hi trobaràs un accés directe per escriure’ns a la secció de Configuració de l’app.</p>", "footer": "© 2026 FullGrader. Tots els drets reservats."}, "gl": {"label": "Galego", "title": "Política de privacidade", "updated": "Última actualización: 8 de outubro de 2026", "lead": "<strong>FullGrader non recolle ningún dato.</strong> Toda a información que introduces —as túas clases, o teu alumnado, as túas plantillas de exame e as follas corrixidas, incluídas as fotos— gárdase unicamente no teu propio dispositivo. A app non ten servidores, non ten contas de usuario e non envía nada a internet. As únicas excepcións son opcionais e só ocorren se ti o pides: ler de Google Classroom os nomes do teu alumnado e enviar a Google Classroom as notas dun exame (explícase máis abaixo). E se decides subscribirte a FullGrader Premium, o pagamento xestiónao Google Play (explícase máis abaixo).", "body": "<h2>Que información manexa a app</h2>\n<p>FullGrader garda no teu móbil ou tableta o que ti introduces: os nomes das túas clases, os nomes e códigos de catro cifras do teu alumnado, as plantillas de exame que creas, as respostas correctas, e o resultado de cada folla corrixida coa súa nota.</p>\n<p>Todo iso vive nunha base de datos dentro do almacenamento privado da aplicación, ao que ningunha outra app do dispositivo ten acceso. Nós tampouco: non existe ningunha copia en ningún sitio que non sexa o teu dispositivo.</p>\n<h2>A cámara e as fotos dos exames</h2>\n<p>Para corrixir unha folla, FullGrader necesita facerlle unha foto. Esa foto analízase no propio dispositivo: o recoñecemento das caixas marcadas faino a app, sen conexión e sen intervención de ningún servizo externo.</p>\n<p>A foto gárdase xunto co resultado para que poidas revisala máis tarde e corrixir a man calquera resposta que se lese mal. Queda no almacenamento privado da app e non se sobe a internet, non se garda no teu carrete nin se comparte con ninguén.</p>\n<p>A app tamén pode pedirche acceso ás túas fotos, pero unicamente se decides poñer o logotipo do teu centro nas follas impresas. Nese caso só se utiliza a imaxe que ti escollas, e úsase exclusivamente para debuxala nas plantillas.</p>\n<h2>Os datos do teu alumnado</h2>\n<p>Ao usar FullGrader introduces nomes de alumnado, que na maioría dos casos son menores de idade. Convén que quede claro como funciona isto.</p>\n<p>Esa información non chega en ningún momento a quen desenvolve FullGrader nin a ningún terceiro: queda no teu dispositivo, igual que se a escribises nun caderno ou nunha folla de cálculo gardada no teu ordenador. A app é a ferramenta; os datos seguen sendo teus e do teu centro.</p>\n<p>Iso tamén significa que a responsabilidade sobre eses datos segue sendo do profesorado e do centro educativo, dentro das normas de protección de datos que vos apliquen. Recomendámosche protexer o dispositivo con código ou pegada, como farías con calquera documento con notas do teu alumnado.</p>\n<h2>Copias de seguranza e exportacións</h2>\n<p>FullGrader permíteche crear unha copia de seguranza con toda a túa información, e exportar as notas dun exame a un ficheiro para abrilo en Excel. Tamén xera as follas de exame en PDF para imprimilas.</p>\n<p>Eses ficheiros xéralos ti e decides ti que facer con eles: gardalos, envialos por correo ou subilos ao teu servizo de almacenamento na nube. A partir do momento en que saes da app cun deses ficheiros, a súa custodia pasa a depender de onde o gardes. FullGrader non intervén nese proceso nin conserva copia de nada.</p>\n<h2>Importar a lista desde Google Classroom (opcional)</h2>\n<p>Se tocas «Importar desde Google Classroom», a app pídeche iniciar sesión coa túa conta de Google e pídeche dous permisos de <strong>só lectura</strong>: ver as túas clases de Classroom e ver as súas listas de alumnado. Con eles, FullGrader descarga directamente de Google ao teu dispositivo a lista das túas clases e o nome e os apelidos do alumnado da clase que escollas. Non se len correos, notas, traballos nin ningún outro dato, e ao importar, a app non envía a Google nin a ninguén ningunha información túa nin do teu alumnado.</p>\n<p>Todo ocorre entre o teu dispositivo e Google: esa información non pasa por ningún servidor noso (non temos ningún) e só se usa para engadir ese alumnado á clase de FullGrader que escollas. Ao rematar, a app pecha a sesión de Google e non garda a túa conta nin o teu acceso. Podes retirar o permiso cando queiras en <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>O uso que fai FullGrader da información recibida das API de Google axústase á <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Política de datos de usuario dos servizos de API de Google</a>, incluídos os requisitos de uso limitado.</p>\n<h2>Enviar as notas a Google Classroom (opcional)</h2>\n<p>Desde un exame podes tocar «Enviar notas a Classroom». É opcional, non se activa nunca por si só e só ocorre se o pides e o confirmas cada vez. Para iso, a app pídeche iniciar sesión coa túa conta de Google e, ademais dos dous permisos de lectura de antes, <strong>un permiso máis</strong>: crear tarefas e poñer notas nas túas clases de Classroom.</p>\n<p>Esta é a única función na que información do teu alumnado sae do teu dispositivo. O que se envía a Google é o título da proba, a súa nota máxima e a nota de cada alumno, que se pon na entrega dese alumno en Classroom. Para saber que alumno é cal, a app compara, dentro do teu dispositivo, o nome e os apelidos da túa lista cos da clase de Classroom; os nomes da túa lista non se envían. Non se envían fotos, respostas nin ningún outro dato.</p>\n<p>A app crea unha tarefa nova na clase que escollas (o alumnado verá aparecer a tarefa en Classroom) e deixa as notas como borrador: o alumnado non as ve ata que ti as devolves desde Classroom, e a app nunca as devolve pola súa conta. Para poder actualizar esas notas máis adiante sen crear outra tarefa, a app garda no teu dispositivo que clase e que tarefa de Classroom se usaron. Ao rematar, pecha a sesión de Google e non garda a túa conta nin o teu acceso. Podes retirar o permiso cando queiras en <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Todo ocorre entre o teu dispositivo e Google, sen pasar por ningún servidor noso (non temos ningún). Unha vez en Classroom, as notas quedan na túa clase, baixo a túa conta e suxeitas ás condicións de Google e do teu centro.</p>\n<h2>Subscrición FullGrader Premium (opcional)</h2><p>FullGrader ten unha subscrición opcional, FullGrader Premium. Se decides contratala, o pagamento procésao <strong>Google Play</strong>, coa túa conta de Google na tenda. FullGrader non recibe nin garda a túa tarxeta, os teus datos de pagamento nin a túa identidade: só recibe de Google Play, no teu propio dispositivo, o aviso de se tes a subscrición activa.</p><p>Para iso a app garda no teu dispositivo se Premium está activo e a data da última comprobación, e cantas avaliacións gardaches este mes (para aplicar o límite da versión gratuíta). Ese contador non entra nas copias de seguranza nin sae do dispositivo. A xestión da subscrición, a cancelación e os reembolsos fanse en Google Play e réxense polas súas condicións.</p><h2>O que FullGrader non fai</h2>\n<p>Non hai contas de usuario nin rexistro: non che pedimos correo, nin teléfono, nin nada semellante. Non hai publicidade de ningún tipo. Non hai sistemas de analítica nin de seguimento: non medimos como usas a app, nin cantas veces a abres, nin desde onde. Non hai compoñentes de terceiros que recollan información en segundo plano. E non vendemos nin cedemos datos a ninguén, sinxelamente porque non temos ningún.</p>\n<h2>Permisos que pide a app</h2>\n<p>FullGrader solicita acceso á <strong>cámara</strong>, que é imprescindible para fotografar as follas de exame e corrixilas.</p>\n<p>E pode solicitar acceso ás túas <strong>fotos</strong>, unicamente se escolles poñer o logotipo do teu centro nas plantillas. Se non usas esa función, podes denegar o permiso sen que nada deixe de funcionar.</p>\n<p>Non se pide acceso a contactos, localización, micrófono, calendario nin a ningún outro dato do dispositivo.</p>\n<h2>Como eliminar a túa información</h2>\n<p>Dentro da app podes borrar en calquera momento clases, alumnado, exames e follas corrixidas concretas. E se queres eliminalo absolutamente todo, abonda con desinstalar FullGrader: ao facelo, o sistema operativo borra a base de datos e as fotos xunto coa aplicación, sen deixar rastro.</p>\n<p>Como non hai servidores, non hai nada que solicitar nin ningún trámite que facer para que se elimine a túa información: vaise contigo.</p>\n<h2>Menores</h2>\n<p>FullGrader é unha ferramenta dirixida ao profesorado, non ao alumnado. Aínda que conteña nomes de menores introducidos polo docente, a app non está pensada para que a usen menores nin recolle información deles por si mesma.</p>\n<h2>Cambios nesta política</h2>\n<p>Se no futuro FullGrader incorpora funcións que cambien algo do anterior, esta páxina actualizarase e modificarase a data do principio. Se o cambio fose importante, avisarase tamén dentro da propia aplicación.</p>\n<h2>Contacto</h2>\n<p>Para calquera dúbida sobre esta política ou sobre o tratamento de datos en FullGrader, podes escribir a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. Tamén atoparás un acceso directo para escribirnos na sección de Axustes da app.</p>", "footer": "© 2026 FullGrader. Todos os dereitos reservados."}, "eu": {"label": "Euskara", "title": "Pribatutasun-politika", "updated": "Azken eguneratzea: 2026ko urriaren 8a", "lead": "<strong>FullGrader-ek ez du daturik biltzen.</strong> Sartzen duzun informazio guztia —zure ikasgelak, zure ikasleak, zure azterketa-txantiloiak eta zuzendutako orriak, argazkiak barne— zure gailuan bakarrik gordetzen da. Aplikazioak ez du zerbitzaririk, ez du erabiltzaile-konturik eta ez du ezer bidaltzen internetera. Salbuespenak aukerakoak dira eta zuk eskatzen baduzu soilik gertatzen dira: zure ikasleen izenak Google Classroom-etik irakurtzea eta azterketa baten notak Google Classroom-era bidaltzea (beherago azaltzen da). Eta FullGrader Premium-era harpidetzea erabakitzen baduzu, ordainketa Google Play-k kudeatzen du (jarraian azaltzen da).", "body": "<h2>Zer informazio erabiltzen du aplikazioak</h2>\n<p>FullGrader-ek zure mugikorrean edo tabletan gordetzen du zuk sartutakoa: zure ikasgelen izenak, zure ikasleen izenak eta lau zifrako kodeak, sortzen dituzun azterketa-txantiloiak, erantzun zuzenak, eta zuzendutako orri bakoitzaren emaitza bere notarekin.</p>\n<p>Hori guztia aplikazioaren biltegiratze pribatuko datu-base batean dago, eta gailuko beste inongo aplikaziok ez du hara sartzeko aukerarik. Guk ere ez: ez dago kopiarik zure gailutik kanpo.</p>\n<h2>Kamera eta azterketen argazkiak</h2>\n<p>Orri bat zuzentzeko, FullGrader-ek argazki bat atera behar dio. Argazki hori gailuan bertan aztertzen da: markatutako laukiak aplikazioak berak ezagutzen ditu, konexiorik gabe eta kanpoko zerbitzurik erabili gabe.</p>\n<p>Argazkia emaitzarekin batera gordetzen da, geroago berrikusi ahal izateko eta gaizki irakurritako erantzunen bat eskuz zuzentzeko. Aplikazioaren biltegiratze pribatuan geratzen da: ez da internetera igotzen, ez da zure argazki-bildumara gordetzen eta ez da inorekin partekatzen.</p>\n<p>Aplikazioak zure argazkietarako sarbidea ere eska diezazuke, baina soilik zure ikastetxearen logotipoa inprimatutako orrietan jartzea erabakitzen baduzu. Kasu horretan zuk aukeratzen duzun irudia bakarrik erabiltzen da, eta txantiloietan marrazteko soilik.</p>\n<h2>Zure ikasleen datuak</h2>\n<p>FullGrader erabiltzean ikasleen izenak sartzen dituzu, eta kasu gehienetan adingabeak dira. Komeni da argi geratzea nola funtzionatzen duen honek.</p>\n<p>Informazio hori ez zaio inoiz iristen FullGrader garatzen duenari, ezta hirugarrenei ere: zure gailuan geratzen da, koaderno batean edo zure ordenagailuan gordetako kalkulu-orri batean idatziko bazenu bezalaxe. Aplikazioa tresna da; datuak zureak eta zure ikastetxearenak izaten jarraitzen dute.</p>\n<p>Horrek esan nahi du datu horien gaineko erantzukizuna irakaslearena eta ikastetxearena dela oraindik ere, zuei aplikatzen zaizkizuen datu-babeserako arauen barruan. Gomendagarria da gailua kodearekin edo hatz-markarekin babestea, zure ikasleen notak dituen edozein dokumenturekin egingo zenukeen bezala.</p>\n<h2>Segurtasun-kopiak eta esportazioak</h2>\n<p>FullGrader-ek zure informazio guztiarekin segurtasun-kopia bat sortzeko aukera ematen dizu, eta azterketa baten notak fitxategi batera esportatzekoa, Excel-en irekitzeko. Azterketa-orriak PDF formatuan ere sortzen ditu inprimatzeko.</p>\n<p>Fitxategi horiek zuk sortzen dituzu eta zuk erabakitzen duzu zer egin haiekin: gorde, posta bidez bidali edo zure hodeiko biltegiratze-zerbitzura igo. Fitxategi horietako batekin aplikaziotik irteten zaren unetik, haren zaintza non gordetzen duzunaren araberakoa da. FullGrader-ek ez du prozesu horretan parte hartzen, ezta ezeren kopiarik gordetzen ere.</p>\n<h2>Zerrenda Google Classroom-etik inportatzea (aukerakoa)</h2>\n<p>«Inportatu Google Classroom-etik» sakatzen baduzu, aplikazioak zure Google kontuarekin saioa hasteko eskatuko dizu, eta <strong>irakurtzeko soilik</strong> diren bi baimen eskatuko dizkizu: zure Classroom-eko ikasgelak ikustea eta haien ikasle-zerrendak ikustea. Horiekin, FullGrader-ek zuzenean Google-tik zure gailura deskargatzen ditu zure ikasgelen zerrenda eta aukeratzen duzun ikasgelako ikasleen izenak eta abizenak. Ez da posta elektronikorik, notarik, lanik ezta beste daturik ere irakurtzen, eta inportatzean, aplikazioak ez dio Google-ri ezta inori ere bidaltzen zure edo zure ikasleen inolako informaziorik.</p>\n<p>Dena zure gailuaren eta Google-ren artean gertatzen da: informazio hori ez da gure inolako zerbitzaritik igarotzen (ez dugu bat ere) eta ikasle horiek zuk aukeratzen duzun FullGrader-eko ikasgelara gehitzeko soilik erabiltzen da. Amaitzean, aplikazioak Google-ko saioa ixten du eta ez du zure kontua ezta zure sarbidea gordetzen. Baimena nahi duzunean ken dezakezu hemen: <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>FullGrader-ek Google-ren APIetatik jasotako informazioaz egiten duen erabilera <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Google-ren API zerbitzuen erabiltzaile-datuen politikara</a> egokitzen da, erabilera mugatuaren baldintzak barne.</p>\n<h2>Notak Google Classroom-era bidaltzea (aukerakoa)</h2>\n<p>Azterketa batetik «Bidali notak Classroom-era» sakatu dezakezu. Aukerakoa da, ez da inoiz bere kabuz aktibatzen eta zuk eskatzen eta aldi bakoitzean berresten baduzu soilik gertatzen da. Horretarako, aplikazioak zure Google kontuarekin saioa hasteko eskatuko dizu eta, goiko irakurtzeko bi baimenez gain, <strong>beste baimen bat</strong>: zeregin berriak sortzea eta zure Classroom-eko ikasgelei notak jartzea.</p>\n<p>Hau da zure ikasleen informazioa zure gailutik ateratzen den funtzio bakarra. Google-ri bidaltzen zaiona hau da: probaren izenburua, gehieneko nota eta ikasle bakoitzaren nota, Classroom-en ikasle horren entregan jartzen dena. Zein ikasle den zein jakiteko, aplikazioak zure gailuaren barruan alderatzen ditu zure zerrendako izenak eta abizenak Classroom-eko ikasgelakoekin; zure zerrendako izenak ez dira bidaltzen. Ez dira argazkirik, erantzunik ez beste daturik bidaltzen.</p>\n<p>Aplikazioak zeregin berri bat sortzen du aukeratzen duzun ikasgelan (ikasleek Classroom-en agertzen ikusiko dute) eta notak zirriborro gisa uzten ditu: ikasleek ez dituzte ikusten zuk Classroom-etik itzuli arte, eta aplikazioak ez ditu inoiz bere kabuz itzultzen. Nota horiek geroago beste zeregin bat sortu gabe eguneratu ahal izateko, aplikazioak zure gailuan gordetzen du zein ikasgela eta zein Classroom zeregin erabili diren. Amaitzean, Google-ko saioa ixten du eta ez du zure kontua ezta zure sarbidea gordetzen. Baimena nahi duzunean ken dezakezu hemen: <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Dena zure gailuaren eta Google-ren artean gertatzen da, gure inolako zerbitzaritik igaro gabe (ez dugu bat ere). Classroom-en dauden neurrian, notak zure ikasgelan geratzen dira, zure kontupean eta Google-ren zein zure ikastetxearen baldintzen mende.</p>\n<h2>FullGrader Premium harpidetza (aukerakoa)</h2><p>FullGraderrek aukerako harpidetza bat du: FullGrader Premium. Kontratatzea erabakitzen baduzu, ordainketa <strong>Google Play</strong>-k prozesatzen du, dendan duzun Google kontuarekin. FullGraderrek ez du jasotzen ez gordetzen zure txartela, ordainketa datuak edo zure identitatea: Google Play-tik soilik jasotzen du, zure gailuan bertan, harpidetza aktibo duzun ala ez.</p><p>Horretarako, aplikazioak zure gailuan gordetzen du Premium aktibo dagoen ala ez eta azken egiaztapenaren data, eta hilabete honetan zenbat ebaluazio gorde dituzun (doako bertsioaren muga aplikatzeko). Kontagailu hori ez da segurtasun-kopietan sartzen eta ez da gailutik ateratzen. Harpidetzaren kudeaketa, ezeztapena eta itzulketak Google Play-n egiten dira eta haren baldintzek arautzen dituzte.</p><h2>FullGrader-ek egiten ez duena</h2>\n<p>Ez dago erabiltzaile-konturik ez izen-ematerik: ez dizugu postarik, ez telefonorik, ez antzeko ezer eskatzen. Ez dago inolako publizitaterik. Ez dago analitika- edo jarraipen-sistemarik: ez dugu neurtzen nola erabiltzen duzun aplikazioa, ez zenbat aldiz irekitzen duzun, ez nondik. Ez dago hirugarrenen osagairik bigarren planoan informazioa biltzen duenik. Eta ez dugu daturik saltzen ez lagatzen inori, besterik gabe ez dugulako bat ere.</p>\n<h2>Aplikazioak eskatzen dituen baimenak</h2>\n<p>FullGrader-ek <strong>kamerarako</strong> sarbidea eskatzen du, ezinbestekoa baita azterketa-orriak argazkitzeko eta zuzentzeko.</p>\n<p>Eta zure <strong>argazkietarako</strong> sarbidea eska dezake, soilik zure ikastetxearen logotipoa txantiloietan jartzea aukeratzen baduzu. Funtzio hori erabiltzen ez baduzu, baimena uka dezakezu ezer funtzionatzeari utzi gabe.</p>\n<p>Ez da eskatzen kontaktuetarako, kokapenerako, mikrofonorako, egutegirako edo gailuko beste inongo daturako sarbiderik.</p>\n<h2>Nola ezabatu zure informazioa</h2>\n<p>Aplikazioaren barruan edozein unetan ezaba ditzakezu ikasgela, ikasle, azterketa eta zuzendutako orri jakinak. Eta dena erabat ezabatu nahi baduzu, nahikoa da FullGrader desinstalatzea: hala eginda, sistema eragileak datu-basea eta argazkiak aplikazioarekin batera ezabatzen ditu, arrastorik utzi gabe.</p>\n<p>Zerbitzaririk ez dagoenez, ez dago ezer eskatu beharrik ez izapiderik egin beharrik zure informazioa ezabatzeko: zurekin doa.</p>\n<h2>Adingabeak</h2>\n<p>FullGrader irakasleentzako tresna da, ez ikasleentzat. Irakasleak sartutako adingabeen izenak eduki arren, aplikazioa ez dago adingabeek erabiltzeko pentsatuta, ezta haiei buruzko informazioa berez biltzeko ere.</p>\n<h2>Politika honen aldaketak</h2>\n<p>Etorkizunean FullGrader-ek aurrekoaren zerbait aldatzen duten funtzioak gehitzen baditu, orri hau eguneratu egingo da eta hasierako data aldatuko da. Aldaketa garrantzitsua balitz, aplikazioaren barruan ere abisatuko da.</p>\n<h2>Harremana</h2>\n<p>Politika honi buruzko edo FullGrader-eko datuen tratamenduari buruzko edozein zalantzarako, hona idatz dezakezu: <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. Aplikazioaren Ezarpenak atalean ere aurkituko duzu guri idazteko lasterbide bat.</p>", "footer": "© 2026 FullGrader. Eskubide guztiak erreserbatuta."}, "en": {"label": "English", "title": "Privacy policy", "updated": "Last updated: October 8, 2026", "lead": "<strong>FullGrader collects no data.</strong> Everything you enter — your classes, your students, your exam templates and the graded sheets, photos included — is stored on your own device and nowhere else. The app has no servers, no user accounts, and sends nothing to the internet. The only exceptions are optional and happen only if you ask for them: reading your students’ names from Google Classroom, and sending the grades of an exam to Google Classroom (explained below). And if you choose to subscribe to FullGrader Premium, payment is handled by Google Play (explained below).", "body": "<h2>What information the app handles</h2>\n<p>FullGrader stores on your phone or tablet whatever you enter: the names of your classes, your students' names and four-digit codes, the exam templates you create, the correct answers, and the result of each graded sheet with its score.</p>\n<p>All of it lives in a database inside the app's private storage, which no other app on the device can reach. Neither can we: there is no copy of it anywhere other than your device.</p>\n<h2>The camera and the exam photos</h2>\n<p>To grade a sheet, FullGrader needs to take a photo of it. That photo is analysed on the device itself: recognising the filled-in bubbles is done by the app, offline, with no external service involved.</p>\n<p>The photo is kept alongside the result so you can review it later and fix by hand any answer that was misread. It stays in the app's private storage: it is not uploaded to the internet, not saved to your camera roll, and not shared with anyone.</p>\n<p>The app may also ask for access to your photos, but only if you decide to put your school's logo on the printed sheets. In that case only the image you pick is used, and only to draw it on the templates.</p>\n<h2>Your students' data</h2>\n<p>When you use FullGrader you enter students' names, and in most cases those students are minors. It is worth being clear about how this works.</p>\n<p>That information never reaches the developer of FullGrader or any third party: it stays on your device, exactly as if you had written it in a notebook or a spreadsheet saved on your computer. The app is the tool; the data remains yours and your school's.</p>\n<p>It also means responsibility for that data remains with the teacher and the school, under whatever data protection rules apply to you. We recommend protecting the device with a passcode or fingerprint, as you would any document holding your students' grades.</p>\n<h2>Backups and exports</h2>\n<p>FullGrader lets you create a backup containing all your information, and export the grades of an exam to a file you can open in Excel. It also generates the answer sheets as PDFs for printing.</p>\n<p>You create those files and you decide what to do with them: save them, email them, or upload them to your cloud storage. From the moment you leave the app with one of those files, keeping it safe depends on where you put it. FullGrader plays no part in that and keeps no copy of anything.</p>\n<h2>Importing the list from Google Classroom (optional)</h2>\n<p>If you tap “Import from Google Classroom”, the app asks you to sign in with your Google account and asks for two <strong>read-only</strong> permissions: to see your Classroom classes and to see their student lists. With them, FullGrader downloads directly from Google to your device the list of your classes and the first and last names of the students in the class you choose. No emails, grades, assignments or any other data are read, and when importing, the app sends no information about you or your students to Google or anyone else.</p>\n<p>Everything happens between your device and Google: that information never goes through any server of ours (we have none) and is only used to add those students to the FullGrader class you choose. When it’s done, the app signs out of Google and keeps neither your account nor your access. You can remove the permission at any time at <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>FullGrader’s use of information received from Google APIs adheres to the <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Google API Services User Data Policy</a>, including the Limited Use requirements.</p>\n<h2>Sending grades to Google Classroom (optional)</h2>\n<p>From an exam you can tap “Send grades to Classroom”. It is optional, never turns on by itself, and only happens if you ask for it and confirm it each time. To do it, the app asks you to sign in with your Google account and, in addition to the two read-only permissions above, <strong>one more permission</strong>: to create assignments and enter grades in your Classroom classes.</p>\n<p>This is the only feature in which information about your students leaves your device. What is sent to Google is the title of the test, its maximum grade and each student’s grade, which is entered in that student’s submission in Classroom. To know which student is which, the app compares, inside your device, the first and last names on your list with those of the Classroom class; the names on your list are not sent. No photos, answers or any other data are sent.</p>\n<p>The app creates a new assignment in the class you choose (students will see it appear in Classroom) and leaves the grades as a draft: students can’t see them until you return them from Classroom, and the app never returns them on its own. So that those grades can be updated later without creating another assignment, the app stores on your device which Classroom class and assignment were used. When it’s done, it signs out of Google and keeps neither your account nor your access. You can remove the permission at any time at <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Everything happens between your device and Google, without going through any server of ours (we have none). Once in Classroom, the grades stay in your class, under your account and subject to the terms of Google and of your school.</p>\n<h2>FullGrader Premium subscription (optional)</h2><p>FullGrader has an optional subscription, FullGrader Premium. If you choose to subscribe, payment is processed by <strong>Google Play</strong> using your Google account in the store. FullGrader does not receive or store your card, your payment details or your identity: it only receives from Google Play, on your own device, a notice of whether your subscription is active.</p><p>To do this, the app stores on your device whether Premium is active and the date of the last check, and how many evaluations you have saved this month (to apply the free-version limit). That counter is not included in backups and never leaves the device. Managing the subscription, cancelling and refunds are handled in Google Play and are governed by its terms.</p><h2>What FullGrader does not do</h2>\n<p>There are no user accounts and no sign-up: we do not ask for your email, your phone number, or anything of the sort. There is no advertising of any kind. There is no analytics or tracking: we do not measure how you use the app, how often you open it, or where from. There are no third-party components gathering information in the background. And we do not sell or share data with anyone, simply because we hold none.</p>\n<h2>Permissions the app requests</h2>\n<p>FullGrader requests access to the <strong>camera</strong>, which is essential for photographing the answer sheets and grading them.</p>\n<p>It may also request access to your <strong>photos</strong>, but only if you choose to put your school's logo on the templates. If you do not use that feature, you can deny the permission and nothing will stop working.</p>\n<p>No access is requested to contacts, location, microphone, calendar, or any other data on the device.</p>\n<h2>How to delete your information</h2>\n<p>Inside the app you can delete individual classes, students, exams and graded sheets at any time. And if you want to remove absolutely everything, simply uninstall FullGrader: the operating system deletes the database and the photos along with the app, leaving nothing behind.</p>\n<p>Since there are no servers, there is nothing to request and no procedure to follow to have your information erased: it leaves with you.</p>\n<h2>Minors</h2>\n<p>FullGrader is a tool for teachers, not for students. Although it holds names of minors entered by the teacher, the app is not intended to be used by minors and does not collect information about them by itself.</p>\n<h2>Changes to this policy</h2>\n<p>If FullGrader gains features in future that change anything described above, this page will be updated and the date at the top changed. If the change is significant, notice will also be given inside the app itself.</p>\n<h2>Contact</h2>\n<p>For any question about this policy or about how FullGrader handles data, you can write to <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. You will also find a shortcut for writing to us in the app's Settings section.</p>", "footer": "© 2026 FullGrader. All rights reserved."}, "de": {"label": "Deutsch", "title": "Datenschutzerklärung", "updated": "Zuletzt aktualisiert: 8. Oktober 2026", "lead": "<strong>FullGrader erhebt keinerlei Daten.</strong> Alle Informationen, die Sie eingeben – Ihre Klassen, Ihre Schülerinnen und Schüler, Ihre Prüfungsvorlagen und die korrigierten Bögen einschließlich der Fotos –, werden ausschließlich auf Ihrem eigenen Gerät gespeichert. Die App hat keine Server, keine Benutzerkonten und sendet nichts ins Internet. Die einzigen Ausnahmen sind optional und erfolgen nur auf Ihre Veranlassung: das Abrufen der Namen Ihrer Schülerinnen und Schüler aus Google Classroom und das Senden der Noten einer Prüfung an Google Classroom (siehe unten). Und wenn Sie FullGrader Premium abonnieren, wird die Zahlung über Google Play abgewickelt (siehe unten).", "body": "<h2>Welche Informationen die App verarbeitet</h2>\n<p>FullGrader speichert auf Ihrem Smartphone oder Tablet, was Sie eingeben: die Namen Ihrer Klassen, die Namen und vierstelligen Codes Ihrer Schülerinnen und Schüler, die von Ihnen erstellten Prüfungsvorlagen, die richtigen Antworten sowie das Ergebnis jedes korrigierten Bogens mit seiner Note.</p>\n<p>All dies befindet sich in einer Datenbank im privaten Speicherbereich der App, auf den keine andere App auf dem Gerät Zugriff hat. Auch wir nicht: Es gibt nirgendwo eine Kopie außer auf Ihrem Gerät.</p>\n<h2>Die Kamera und die Fotos der Prüfungen</h2>\n<p>Um einen Bogen zu korrigieren, muss FullGrader ein Foto davon aufnehmen. Dieses Foto wird auf dem Gerät selbst ausgewertet: Die Erkennung der angekreuzten Kästchen übernimmt die App, offline und ohne Beteiligung eines externen Dienstes.</p>\n<p>Das Foto wird zusammen mit dem Ergebnis gespeichert, damit Sie es später überprüfen und falsch erkannte Antworten von Hand korrigieren können. Es verbleibt im privaten Speicherbereich der App und wird weder ins Internet hochgeladen noch in Ihrer Galerie gespeichert oder an Dritte weitergegeben.</p>\n<p>Die App kann Sie außerdem um Zugriff auf Ihre Fotos bitten, jedoch nur, wenn Sie das Logo Ihrer Schule auf die gedruckten Bögen setzen möchten. In diesem Fall wird nur das von Ihnen gewählte Bild verwendet, und zwar ausschließlich, um es auf die Vorlagen zu drucken.</p>\n<h2>Die Daten Ihrer Schülerinnen und Schüler</h2>\n<p>Wenn Sie FullGrader nutzen, geben Sie Namen von Schülerinnen und Schülern ein, die in den meisten Fällen minderjährig sind. Deshalb soll klar sein, wie das funktioniert.</p>\n<p>Diese Informationen gelangen zu keinem Zeitpunkt an die Entwickler von FullGrader oder an Dritte: Sie bleiben auf Ihrem Gerät, so als hätten Sie sie in ein Heft oder in eine Tabelle auf Ihrem Computer geschrieben. Die App ist das Werkzeug; die Daten gehören weiterhin Ihnen und Ihrer Schule.</p>\n<p>Das bedeutet auch, dass die Verantwortung für diese Daten weiterhin bei der Lehrkraft und der Bildungseinrichtung liegt, im Rahmen der für Sie geltenden Datenschutzvorschriften. Wir empfehlen Ihnen, das Gerät mit einem Code oder Fingerabdruck zu schützen, wie Sie es bei jedem Dokument mit Noten Ihrer Schülerinnen und Schüler tun würden.</p>\n<h2>Sicherungen und Exporte</h2>\n<p>Mit FullGrader können Sie eine Sicherung mit all Ihren Informationen erstellen und die Noten einer Prüfung in eine Datei exportieren, die sich in Excel öffnen lässt. Außerdem erzeugt die App die Prüfungsbögen als PDF zum Ausdrucken.</p>\n<p>Diese Dateien erstellen Sie selbst, und Sie entscheiden, was damit geschieht: ob Sie sie speichern, per E-Mail versenden oder in Ihren Cloud-Speicher hochladen. Sobald Sie eine dieser Dateien aus der App heraus weitergeben, hängt ihre Sicherheit davon ab, wo Sie sie aufbewahren. FullGrader ist an diesem Vorgang nicht beteiligt und behält keine Kopie davon.</p>\n<h2>Liste aus Google Classroom importieren (optional)</h2>\n<p>Wenn Sie auf „Aus Google Classroom importieren“ tippen, fordert die App Sie auf, sich mit Ihrem Google-Konto anzumelden, und bittet um zwei <strong>reine Leseberechtigungen</strong>: Ihre Classroom-Kurse ansehen und deren Teilnehmerlisten ansehen. Damit lädt FullGrader die Liste Ihrer Kurse sowie Vor- und Nachnamen der Schülerinnen und Schüler des von Ihnen gewählten Kurses direkt von Google auf Ihr Gerät. Es werden keine E-Mails, Noten, Arbeiten oder sonstigen Daten gelesen, und beim Import sendet die App keinerlei Informationen über Sie oder Ihre Schülerinnen und Schüler an Google oder an Dritte.</p>\n<p>Alles geschieht zwischen Ihrem Gerät und Google: Diese Informationen laufen über keinen Server von uns (wir haben keinen) und werden nur verwendet, um diese Schülerinnen und Schüler der von Ihnen gewählten Klasse in FullGrader hinzuzufügen. Anschließend meldet die App Sie bei Google ab und speichert weder Ihr Konto noch Ihren Zugang. Sie können die Berechtigung jederzeit unter <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a> widerrufen.</p>\n<p>Die Nutzung der über Google-APIs erhaltenen Informationen durch FullGrader entspricht der <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Richtlinie zu Nutzerdaten für Google API-Dienste</a>, einschließlich der Anforderungen zur eingeschränkten Nutzung (Limited Use).</p>\n<h2>Noten an Google Classroom senden (optional)</h2>\n<p>In einer Prüfung können Sie auf „Noten an Classroom senden“ tippen. Diese Funktion ist optional, wird nie von selbst aktiviert und erfolgt nur, wenn Sie sie anfordern und jedes Mal bestätigen. Dazu fordert die App Sie auf, sich mit Ihrem Google-Konto anzumelden, und bittet zusätzlich zu den beiden oben genannten Leseberechtigungen um <strong>eine weitere Berechtigung</strong>: Aufgaben erstellen und Noten in Ihren Classroom-Kursen eintragen.</p>\n<p>Dies ist die einzige Funktion, bei der Informationen über Ihre Schülerinnen und Schüler Ihr Gerät verlassen. An Google gesendet werden der Titel der Prüfung, ihre Höchstnote und die Note jeder Schülerin bzw. jedes Schülers, die in deren Abgabe in Classroom eingetragen wird. Um die Schülerinnen und Schüler einander zuzuordnen, vergleicht die App auf Ihrem Gerät die Vor- und Nachnamen Ihrer Liste mit denen des Classroom-Kurses; die Namen Ihrer Liste werden nicht gesendet. Es werden keine Fotos, Antworten oder sonstigen Daten gesendet.</p>\n<p>Die App erstellt in dem von Ihnen gewählten Kurs eine neue Aufgabe (die Schülerinnen und Schüler sehen sie in Classroom erscheinen) und trägt die Noten als Entwurf ein: Die Schülerinnen und Schüler sehen sie erst, wenn Sie sie in Classroom zurückgeben; die App gibt sie niemals von sich aus zurück. Damit diese Noten später aktualisiert werden können, ohne eine weitere Aufgabe zu erstellen, speichert die App auf Ihrem Gerät, welcher Classroom-Kurs und welche Aufgabe verwendet wurden. Anschließend meldet sie Sie bei Google ab und speichert weder Ihr Konto noch Ihren Zugang. Sie können die Berechtigung jederzeit unter <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a> widerrufen.</p>\n<p>Alles geschieht zwischen Ihrem Gerät und Google, ohne über einen Server von uns zu laufen (wir haben keinen). In Classroom verbleiben die Noten in Ihrem Kurs, unter Ihrem Konto und unterliegen den Bedingungen von Google und Ihrer Schule.</p>\n<h2>Abo FullGrader Premium (optional)</h2><p>FullGrader bietet ein optionales Abo an, FullGrader Premium. Wenn Sie es abschließen, wird die Zahlung von <strong>Google Play</strong> über Ihr Google-Konto im Store abgewickelt. FullGrader erhält und speichert weder Ihre Karte noch Ihre Zahlungsdaten oder Ihre Identität: Die App erhält von Google Play auf Ihrem eigenen Gerät lediglich die Information, ob Ihr Abo aktiv ist.</p><p>Dazu speichert die App auf Ihrem Gerät, ob Premium aktiv ist, das Datum der letzten Überprüfung und wie viele Bewertungen Sie in diesem Monat gespeichert haben (um die Grenze der kostenlosen Version anzuwenden). Dieser Zähler ist nicht Teil der Sicherungen und verlässt das Gerät nicht. Verwaltung, Kündigung und Erstattungen des Abos erfolgen über Google Play und unterliegen dessen Bedingungen.</p><h2>Was FullGrader nicht tut</h2>\n<p>Es gibt keine Benutzerkonten und keine Registrierung: Wir fragen weder nach Ihrer E-Mail-Adresse noch nach Ihrer Telefonnummer oder Ähnlichem. Es gibt keinerlei Werbung. Es gibt keine Analyse- oder Tracking-Systeme: Wir messen nicht, wie Sie die App nutzen, wie oft Sie sie öffnen oder von wo aus. Es gibt keine Komponenten von Drittanbietern, die im Hintergrund Informationen sammeln. Und wir verkaufen oder übermitteln keine Daten an Dritte, ganz einfach, weil wir keine haben.</p>\n<h2>Berechtigungen der App</h2>\n<p>FullGrader fordert Zugriff auf die <strong>Kamera</strong> an, der unerlässlich ist, um die Prüfungsbögen zu fotografieren und zu korrigieren.</p>\n<p>Außerdem kann die App Zugriff auf Ihre <strong>Fotos</strong> anfordern, jedoch nur, wenn Sie das Logo Ihrer Schule auf die Vorlagen setzen möchten. Wenn Sie diese Funktion nicht nutzen, können Sie die Berechtigung verweigern, ohne dass etwas anderes nicht mehr funktioniert.</p>\n<p>Es wird kein Zugriff auf Kontakte, Standort, Mikrofon, Kalender oder andere Daten des Geräts angefordert.</p>\n<h2>So löschen Sie Ihre Informationen</h2>\n<p>In der App können Sie jederzeit einzelne Klassen, Schülerinnen und Schüler, Prüfungen und korrigierte Bögen löschen. Und wenn Sie absolut alles löschen möchten, genügt es, FullGrader zu deinstallieren: Dabei löscht das Betriebssystem die Datenbank und die Fotos zusammen mit der App, ohne Spuren zu hinterlassen.</p>\n<p>Da es keine Server gibt, müssen Sie nichts beantragen und keine Formalitäten erledigen, damit Ihre Informationen gelöscht werden: Sie gehen mit Ihnen.</p>\n<h2>Minderjährige</h2>\n<p>FullGrader ist ein Werkzeug für Lehrkräfte, nicht für Schülerinnen und Schüler. Auch wenn die App von der Lehrkraft eingegebene Namen Minderjähriger enthält, ist sie nicht für die Nutzung durch Minderjährige gedacht und erhebt von sich aus keine Informationen über sie.</p>\n<h2>Änderungen dieser Datenschutzerklärung</h2>\n<p>Sollte FullGrader künftig Funktionen erhalten, die etwas an den obigen Angaben ändern, wird diese Seite aktualisiert und das Datum am Anfang angepasst. Bei wesentlichen Änderungen wird zusätzlich in der App selbst darauf hingewiesen.</p>\n<h2>Kontakt</h2>\n<p>Bei Fragen zu dieser Datenschutzerklärung oder zur Datenverarbeitung in FullGrader können Sie an <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a> schreiben. Eine direkte Möglichkeit, uns zu schreiben, finden Sie auch im Bereich Einstellungen der App.</p>", "footer": "© 2026 FullGrader. Alle Rechte vorbehalten."}, "fr": {"label": "Français", "title": "Politique de confidentialité", "updated": "Dernière mise à jour : 8 octobre 2026", "lead": "<strong>FullGrader ne collecte aucune donnée.</strong> Toutes les informations que vous saisissez — vos classes, vos élèves, vos modèles d’examen et les feuilles corrigées, y compris les photos — sont enregistrées uniquement sur votre propre appareil. L’application n’a pas de serveurs, pas de comptes utilisateur et n’envoie rien sur Internet. Les seules exceptions sont facultatives et n’ont lieu que si vous le demandez : lire dans Google Classroom les noms de vos élèves et envoyer à Google Classroom les notes d’un examen (voir ci-dessous). Et si vous décidez de vous abonner à FullGrader Premium, le paiement est géré par Google Play (voir ci-dessous).", "body": "<h2>Les informations traitées par l’application</h2>\n<p>FullGrader enregistre sur votre téléphone ou votre tablette ce que vous saisissez : les noms de vos classes, les noms et les codes à quatre chiffres de vos élèves, les modèles d’examen que vous créez, les bonnes réponses, ainsi que le résultat de chaque feuille corrigée avec sa note.</p>\n<p>Toutes ces informations se trouvent dans une base de données située dans l’espace de stockage privé de l’application, auquel aucune autre application de l’appareil n’a accès. Nous non plus : il n’en existe aucune copie ailleurs que sur votre appareil.</p>\n<h2>L’appareil photo et les photos des examens</h2>\n<p>Pour corriger une feuille, FullGrader doit la prendre en photo. Cette photo est analysée sur l’appareil lui-même : la reconnaissance des cases cochées est effectuée par l’application, hors connexion et sans intervention d’aucun service externe.</p>\n<p>La photo est enregistrée avec le résultat pour que vous puissiez la vérifier plus tard et corriger à la main toute réponse mal lue. Elle reste dans l’espace de stockage privé de l’application : elle n’est pas envoyée sur Internet, n’est pas enregistrée dans votre galerie et n’est partagée avec personne.</p>\n<p>L’application peut aussi vous demander l’accès à vos photos, mais uniquement si vous décidez d’ajouter le logo de votre établissement sur les feuilles imprimées. Dans ce cas, seule l’image que vous choisissez est utilisée, et elle sert exclusivement à être reproduite sur les modèles.</p>\n<h2>Les données de vos élèves</h2>\n<p>En utilisant FullGrader, vous saisissez des noms d’élèves, qui sont dans la plupart des cas des mineurs. Il est important que le fonctionnement soit clair sur ce point.</p>\n<p>Ces informations ne parviennent à aucun moment à la personne qui développe FullGrader ni à aucun tiers : elles restent sur votre appareil, exactement comme si vous les aviez écrites dans un cahier ou dans un tableur enregistré sur votre ordinateur. L’application est l’outil ; les données restent les vôtres et celles de votre établissement.</p>\n<p>Cela signifie également que la responsabilité de ces données incombe toujours à l’enseignant et à l’établissement scolaire, dans le respect des règles de protection des données qui leur sont applicables. Nous vous recommandons de protéger votre appareil par un code ou une empreinte digitale, comme vous le feriez pour tout document contenant les notes de vos élèves.</p>\n<h2>Sauvegardes et exports</h2>\n<p>FullGrader vous permet de créer une sauvegarde de toutes vos informations et d’exporter les notes d’un examen dans un fichier à ouvrir dans Excel. Il génère aussi les feuilles d’examen en PDF pour les imprimer.</p>\n<p>C’est vous qui générez ces fichiers et qui décidez de ce que vous en faites : les conserver, les envoyer par e-mail ou les déposer sur votre service de stockage en ligne. Dès qu’un de ces fichiers quitte l’application, sa conservation dépend de l’endroit où vous l’enregistrez. FullGrader n’intervient pas dans ce processus et ne conserve aucune copie.</p>\n<h2>Importer la liste depuis Google Classroom (facultatif)</h2>\n<p>Si vous touchez « Importer depuis Google Classroom », l’application vous demande de vous connecter avec votre compte Google et sollicite deux autorisations en <strong>lecture seule</strong> : voir vos classes Classroom et voir leurs listes d’élèves. Grâce à elles, FullGrader télécharge directement de Google vers votre appareil la liste de vos classes ainsi que le prénom et le nom des élèves de la classe que vous choisissez. Aucun e-mail, aucune note, aucun devoir ni aucune autre donnée n’est lu, et lors de l’import, l’application n’envoie à Google ni à personne d’autre aucune information vous concernant ou concernant vos élèves.</p>\n<p>Tout se passe entre votre appareil et Google : ces informations ne transitent par aucun serveur nous appartenant (nous n’en avons aucun) et servent uniquement à ajouter ces élèves à la classe FullGrader que vous choisissez. À la fin, l’application se déconnecte de Google et ne conserve ni votre compte ni votre accès. Vous pouvez retirer l’autorisation à tout moment sur <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>L’utilisation par FullGrader des informations reçues des API Google respecte le <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Règlement sur les données utilisateur des services d’API Google</a>, y compris les exigences relatives à l’utilisation limitée.</p>\n<h2>Envoyer les notes à Google Classroom (facultatif)</h2>\n<p>Depuis un examen, vous pouvez toucher « Envoyer les notes à Classroom ». Cette fonction est facultative, ne s’active jamais d’elle-même et n’a lieu que si vous la demandez et la confirmez à chaque fois. Pour cela, l’application vous demande de vous connecter avec votre compte Google et, en plus des deux autorisations de lecture mentionnées ci-dessus, <strong>une autorisation supplémentaire</strong> : créer des devoirs et attribuer des notes dans vos classes Classroom.</p>\n<p>C’est la seule fonction par laquelle des informations sur vos élèves quittent votre appareil. Ce qui est envoyé à Google, c’est le titre de l’évaluation, sa note maximale et la note de chaque élève, qui est enregistrée dans le devoir rendu par cet élève dans Classroom. Pour savoir quel élève correspond à qui, l’application compare, sur votre appareil, le prénom et le nom de votre liste avec ceux de la classe Classroom ; les noms de votre liste ne sont pas envoyés. Aucune photo, aucune réponse ni aucune autre donnée n’est envoyée.</p>\n<p>L’application crée un nouveau devoir dans la classe que vous choisissez (les élèves le verront apparaître dans Classroom) et enregistre les notes comme brouillons : les élèves ne les voient pas tant que vous ne les avez pas rendues depuis Classroom, et l’application ne les rend jamais d’elle-même. Pour pouvoir mettre à jour ces notes plus tard sans créer un autre devoir, l’application enregistre sur votre appareil la classe et le devoir Classroom utilisés. À la fin, elle se déconnecte de Google et ne conserve ni votre compte ni votre accès. Vous pouvez retirer l’autorisation à tout moment sur <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Tout se passe entre votre appareil et Google, sans passer par aucun serveur nous appartenant (nous n’en avons aucun). Une fois dans Classroom, les notes restent dans votre classe, sous votre compte, et sont soumises aux conditions de Google et de votre établissement.</p>\n<h2>Abonnement FullGrader Premium (facultatif)</h2><p>FullGrader propose un abonnement facultatif, FullGrader Premium. Si vous décidez d’y souscrire, le paiement est traité par <strong>Google Play</strong>, avec votre compte Google sur la boutique. FullGrader ne reçoit ni ne conserve votre carte, vos données de paiement ou votre identité : il reçoit seulement de Google Play, sur votre propre appareil, l’information indiquant si votre abonnement est actif.</p><p>Pour cela, l’application enregistre sur votre appareil si Premium est actif et la date de la dernière vérification, ainsi que le nombre d’évaluations que vous avez enregistrées ce mois-ci (pour appliquer la limite de la version gratuite). Ce compteur n’est pas inclus dans les sauvegardes et ne quitte pas l’appareil. La gestion de l’abonnement, sa résiliation et les remboursements se font dans Google Play et sont régis par ses conditions.</p><h2>Ce que FullGrader ne fait pas</h2>\n<p>Il n’y a ni compte utilisateur ni inscription : nous ne vous demandons ni e-mail, ni numéro de téléphone, ni rien de ce genre. Il n’y a aucune publicité, de quelque nature que ce soit. Il n’y a aucun système d’analyse ni de suivi : nous ne mesurons pas la façon dont vous utilisez l’application, ni combien de fois vous l’ouvrez, ni d’où. Aucun composant tiers ne collecte d’informations en arrière-plan. Et nous ne vendons ni ne cédons de données à personne, tout simplement parce que nous n’en avons aucune.</p>\n<h2>Autorisations demandées par l’application</h2>\n<p>FullGrader demande l’accès à l’<strong>appareil photo</strong>, indispensable pour photographier les feuilles d’examen et les corriger.</p>\n<p>Il peut aussi demander l’accès à vos <strong>photos</strong>, uniquement si vous choisissez d’ajouter le logo de votre établissement sur les modèles. Si vous n’utilisez pas cette fonction, vous pouvez refuser l’autorisation sans que rien ne cesse de fonctionner.</p>\n<p>Aucun accès n’est demandé aux contacts, à la localisation, au micro, à l’agenda ni à aucune autre donnée de l’appareil.</p>\n<h2>Comment supprimer vos informations</h2>\n<p>Dans l’application, vous pouvez supprimer à tout moment des classes, des élèves, des examens et des feuilles corrigées. Et si vous voulez tout supprimer, il suffit de désinstaller FullGrader : le système d’exploitation efface alors la base de données et les photos en même temps que l’application, sans laisser de trace.</p>\n<p>Comme il n’y a pas de serveurs, il n’y a aucune demande à faire ni aucune démarche à accomplir pour que vos informations soient supprimées : elles partent avec vous.</p>\n<h2>Mineurs</h2>\n<p>FullGrader est un outil destiné aux enseignants, et non aux élèves. Même s’il contient des noms de mineurs saisis par l’enseignant, l’application n’est pas conçue pour être utilisée par des mineurs et ne collecte d’elle-même aucune information les concernant.</p>\n<h2>Modifications de cette politique</h2>\n<p>Si, à l’avenir, FullGrader intègre des fonctions qui modifient l’un des points ci-dessus, cette page sera mise à jour et la date indiquée en haut sera modifiée. Si la modification est importante, vous en serez également informé dans l’application elle-même.</p>\n<h2>Contact</h2>\n<p>Pour toute question sur cette politique ou sur le traitement des données dans FullGrader, vous pouvez écrire à <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>. Vous trouverez également un accès direct pour nous écrire dans la section Réglages de l’application.</p>", "footer": "© 2026 FullGrader. Tous droits réservés."}, "it": {"label": "Italiano", "title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: 8 ottobre 2026", "lead": "<strong>FullGrader non raccoglie alcun dato.</strong> Tutte le informazioni che inserisci (le tue classi, i tuoi studenti, i tuoi modelli di verifica e i fogli corretti, foto comprese) vengono salvate esclusivamente sul tuo dispositivo. L’app non ha server, non ha account utente e non invia nulla su Internet. Le uniche eccezioni sono facoltative e avvengono solo se lo richiedi tu: leggere da Google Classroom i nomi dei tuoi studenti e inviare a Google Classroom i voti di una verifica (come spiegato più avanti). E se decidi di abbonarti a FullGrader Premium, il pagamento è gestito da Google Play (come spiegato più avanti).", "body": "<h2>Quali informazioni gestisce l’app</h2>\n<p>FullGrader salva sul tuo telefono o tablet ciò che inserisci tu: i nomi delle tue classi, i nomi e i codici a quattro cifre dei tuoi studenti, i modelli di verifica che crei, le risposte corrette e il risultato di ogni foglio corretto con il relativo voto.</p>\n<p>Tutto ciò risiede in un database all’interno della memoria privata dell’applicazione, a cui nessun’altra app del dispositivo ha accesso. Nemmeno noi: non esiste alcuna copia in nessun luogo che non sia il tuo dispositivo.</p>\n<h2>La fotocamera e le foto delle verifiche</h2>\n<p>Per correggere un foglio, FullGrader deve fotografarlo. La foto viene analizzata sul dispositivo stesso: il riconoscimento delle caselle segnate è effettuato dall’app, senza connessione e senza l’intervento di alcun servizio esterno.</p>\n<p>La foto viene salvata insieme al risultato affinché tu possa rivederla in seguito e correggere a mano eventuali risposte lette in modo errato. Rimane nella memoria privata dell’app e non viene caricata su Internet, non viene salvata nella tua galleria né condivisa con nessuno.</p>\n<p>L’app può anche chiederti l’accesso alle tue foto, ma esclusivamente se decidi di inserire il logo della tua scuola sui fogli stampati. In tal caso viene utilizzata solo l’immagine che scegli tu, ed esclusivamente per riprodurla sui modelli.</p>\n<h2>I dati dei tuoi studenti</h2>\n<p>Utilizzando FullGrader inserisci nomi di studenti che, nella maggior parte dei casi, sono minorenni. È opportuno chiarire come funziona questo aspetto.</p>\n<p>Tali informazioni non giungono in alcun momento a chi sviluppa FullGrader né a terzi: rimangono sul tuo dispositivo, esattamente come se le avessi scritte su un quaderno o in un foglio di calcolo salvato sul tuo computer. L’app è lo strumento; i dati restano tuoi e della tua scuola.</p>\n<p>Ciò significa anche che la responsabilità su tali dati resta del docente e dell’istituto scolastico, nel rispetto della normativa sulla protezione dei dati personali a voi applicabile. Ti consigliamo di proteggere il dispositivo con un codice o con l’impronta digitale, come faresti con qualsiasi documento contenente i voti dei tuoi studenti.</p>\n<h2>Backup ed esportazioni</h2>\n<p>FullGrader ti consente di creare un backup con tutte le tue informazioni e di esportare i voti di una verifica in un file da aprire in Excel. Genera inoltre i fogli della verifica in PDF per stamparli.</p>\n<p>Questi file li generi tu e sei tu a decidere cosa farne: salvarli, inviarli per email o caricarli sul tuo servizio di archiviazione cloud. Dal momento in cui esci dall’app con uno di questi file, la sua custodia dipende dal luogo in cui lo conservi. FullGrader non interviene in tale processo né conserva copia di nulla.</p>\n<h2>Importare l’elenco da Google Classroom (facoltativo)</h2>\n<p>Se tocchi «Importa da Google Classroom», l’app ti chiede di accedere con il tuo account Google e richiede due autorizzazioni di <strong>sola lettura</strong>: vedere i tuoi corsi di Classroom e vederne gli elenchi degli studenti. Grazie a queste, FullGrader scarica direttamente da Google sul tuo dispositivo l’elenco dei tuoi corsi e il nome e cognome degli studenti del corso che scegli. Non vengono letti indirizzi email, voti, compiti né alcun altro dato e, durante l’importazione, l’app non invia a Google né ad altri alcuna informazione tua o dei tuoi studenti.</p>\n<p>Tutto avviene tra il tuo dispositivo e Google: tali informazioni non passano per alcun nostro server (non ne abbiamo) e vengono utilizzate esclusivamente per aggiungere quegli studenti alla classe di FullGrader che scegli tu. Al termine, l’app esce dall’account Google e non conserva né il tuo account né il tuo accesso. Puoi revocare l’autorizzazione in qualsiasi momento su <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>L’uso che FullGrader fa delle informazioni ricevute dalle API di Google è conforme alle <a href=\"https://developers.google.com/terms/api-services-user-data-policy\">Norme sui dati utente dei servizi API di Google</a>, inclusi i requisiti di utilizzo limitato.</p>\n<h2>Inviare i voti a Google Classroom (facoltativo)</h2>\n<p>Da una verifica puoi toccare «Invia i voti a Classroom». È una funzione facoltativa, non si attiva mai da sola e avviene solo se la richiedi e la confermi ogni volta. A tal fine, l’app ti chiede di accedere con il tuo account Google e, oltre alle due autorizzazioni di lettura indicate sopra, <strong>un’ulteriore autorizzazione</strong>: creare compiti e assegnare voti nei tuoi corsi di Classroom.</p>\n<p>Questa è l’unica funzione in cui informazioni dei tuoi studenti escono dal tuo dispositivo. Ciò che viene inviato a Google è il titolo della verifica, il suo voto massimo e il voto di ogni studente, che viene registrato nella consegna di quello studente in Classroom. Per sapere quale studente è quale, l’app confronta, all’interno del tuo dispositivo, il nome e il cognome del tuo elenco con quelli del corso di Classroom; i nomi del tuo elenco non vengono inviati. Non vengono inviate foto, risposte né alcun altro dato.</p>\n<p>L’app crea un nuovo compito nel corso che scegli (gli studenti lo vedranno comparire in Classroom) e lascia i voti come bozza: gli studenti non li vedono finché non li restituisci tu da Classroom, e l’app non li restituisce mai di propria iniziativa. Per poter aggiornare quei voti in seguito senza creare un altro compito, l’app salva sul tuo dispositivo quale corso e quale compito di Classroom sono stati utilizzati. Al termine, esce dall’account Google e non conserva né il tuo account né il tuo accesso. Puoi revocare l’autorizzazione in qualsiasi momento su <a href=\"https://myaccount.google.com/permissions\">myaccount.google.com/permissions</a>.</p>\n<p>Tutto avviene tra il tuo dispositivo e Google, senza passare per alcun nostro server (non ne abbiamo). Una volta in Classroom, i voti restano nel tuo corso, sotto il tuo account e soggetti alle condizioni di Google e della tua scuola.</p>\n<h2>Abbonamento FullGrader Premium (facoltativo)</h2><p>FullGrader offre un abbonamento facoltativo, FullGrader Premium. Se decidi di sottoscriverlo, il pagamento viene elaborato da <strong>Google Play</strong>, con il tuo account Google nello store. FullGrader non riceve né conserva la tua carta, i tuoi dati di pagamento né la tua identità: riceve da Google Play, sul tuo stesso dispositivo, soltanto l’informazione relativa al fatto che l’abbonamento sia attivo o meno.</p><p>A tal fine l’app salva sul tuo dispositivo se Premium è attivo e la data dell’ultima verifica, nonché quante valutazioni hai salvato questo mese (per applicare il limite della versione gratuita). Questo contatore non è incluso nei backup né esce dal dispositivo. La gestione dell’abbonamento, la disdetta e i rimborsi avvengono su Google Play e sono disciplinati dalle relative condizioni.</p><h2>Cosa FullGrader non fa</h2>\n<p>Non ci sono account utente né registrazione: non ti chiediamo email, numero di telefono né nulla di simile. Non c’è pubblicità di alcun tipo. Non ci sono sistemi di analisi né di tracciamento: non misuriamo come usi l’app, né quante volte la apri, né da dove. Non ci sono componenti di terzi che raccolgono informazioni in background. E non vendiamo né cediamo dati a nessuno, semplicemente perché non ne abbiamo.</p>\n<h2>Autorizzazioni richieste dall’app</h2>\n<p>FullGrader richiede l’accesso alla <strong>fotocamera</strong>, indispensabile p
