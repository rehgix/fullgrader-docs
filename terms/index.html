<script>
  var DATA = {"es": {"label": "Español", "title": "Condiciones de uso", "updated": "Última actualización: 18 de octubre de 2026", "lead": "<strong>Estas condiciones explican cómo funciona FullGrader y su suscripción opcional, FullGrader Premium.</strong> Al usar la app aceptas lo que sigue. Si no estás de acuerdo, puedes dejar de usarla y desinstalarla en cualquier momento.", "body": "<h2>Qué es FullGrader</h2><p>FullGrader es una herramienta para profesores: ayuda a preparar hojas de examen tipo test y rúbricas, y a corregirlas con la cámara del móvil. Todo se guarda en tu dispositivo, tal y como explica la <a href=\"../privacy/\">política de privacidad</a>.</p><h2>Versión gratuita y FullGrader Premium</h2><p>La versión gratuita permite guardar hasta <strong>80 evaluaciones nuevas al mes</strong> (tests y rúbricas). El contador se reinicia el día 1 de cada mes. Al llegar al límite puedes seguir viendo resultados, exportar y hacer copias de seguridad; solo se bloquea guardar hojas escaneadas nuevas.</p><p><strong>FullGrader Premium</strong> elimina ese límite y desbloquea la conexión con Google Classroom (importar alumnos iniciando sesión con Google y enviar notas), la creación de rúbricas nuevas, poner dos hojas por papel, personalizar el icono de cada clase, usar más de dos modelos de examen, poner tu logo, el análisis de preguntas, la evolución por criterios, los informes en PDF y la copia de seguridad automática. Corregir tests y rúbricas ya creadas, exportar notas, las copias de seguridad e importar la lista de alumnos desde Excel o CSV siguen siendo gratis.</p><h2>Suscripción, precio y renovación</h2><p>Premium es una suscripción <strong>anual con renovación automática</strong>, con <strong>7 días de prueba gratuita</strong> para quien no la haya usado antes. El precio, en la moneda de tu país, lo muestra Google Play antes de confirmar la compra.</p><p>El pago se carga a tu cuenta de Google Play al terminar la prueba y se renueva cada año salvo que canceles al menos 24 horas antes de que acabe el periodo en curso. Puedes cancelar cuando quieras en Google Play (Menú → Pagos y suscripciones → Suscripciones → FullGrader). Si cancelas, conservas Premium hasta el final del periodo ya pagado.</p><h2>Reembolsos</h2><p>Las compras las procesa Google Play, que gestiona los reembolsos según sus propias normas. Puedes pedirlos desde tu historial de pedidos de Google Play. FullGrader no tiene acceso a tus datos de pago.</p><h2>Tus datos y tu responsabilidad</h2><p>Los datos que introduces (clases, alumnos, notas, fotos) son tuyos y se quedan en tu dispositivo. Eres responsable de usarlos conforme a las normas de protección de datos que se apliquen a ti y a tu centro, y de hacer copias de seguridad: si pierdes o reinstalas el dispositivo sin copia, la información no se puede recuperar.</p><h2>Revisa siempre las notas</h2><p>La lectura automática de las hojas puede cometer errores (marcas poco claras, mala luz, papel arrugado…). FullGrader es una ayuda: antes de dar una nota por definitiva, revisa el resultado. La decisión final sobre la calificación es siempre del profesor.</p><h2>Uso aceptable</h2><p>Usa la app solo para fines lícitos y para tu actividad docente. No intentes saltarte los límites de la versión gratuita, ni alterar, copiar o revender la aplicación.</p><h2>Sin garantías y límite de responsabilidad</h2><p>FullGrader se ofrece «tal cual». Hacemos lo posible por que funcione bien, pero no garantizamos que esté libre de errores ni disponible sin interrupciones. En la medida que permita la ley, no respondemos de pérdidas de datos ni de perjuicios derivados del uso de la app, y nuestra responsabilidad, si la hubiera, se limita al importe pagado por Premium en los últimos 12 meses. Esto no afecta a los derechos que la ley te reconozca como consumidor.</p><h2>Cambios en estas condiciones</h2><p>Podemos actualizar estas condiciones. Cuando haya cambios, se modificará la fecha de arriba y, si son importantes, se avisará en la app. Los cambios de precio nunca se aplican a un periodo ya pagado.</p><h2>Quién ofrece FullGrader</h2>\n<p>FullGrader lo desarrolla y lo ofrece <strong>Sergi Olivares</strong>, en Mataró (Barcelona, España).</p>\n<h2>Contacto</h2><p>Para cualquier duda, escribe a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Todos los derechos reservados."}, "ca": {"label": "Català", "title": "Condicions d'ús", "updated": "Última actualització: 18 d'octubre de 2026", "lead": "<strong>Aquestes condicions expliquen com funciona FullGrader i la seva subscripció opcional, FullGrader Premium.</strong> En usar l'app acceptes el que segueix. Si no hi estàs d'acord, pots deixar d'usar-la i desinstal·lar-la en qualsevol moment.", "body": "<h2>Què és FullGrader</h2><p>FullGrader és una eina per a professors: ajuda a preparar fulls d'examen tipus test i rúbriques, i a corregir-los amb la càmera del mòbil. Tot es desa al teu dispositiu, tal com explica la <a href=\"../privacy/\">política de privacitat</a>.</p><h2>Versió gratuïta i FullGrader Premium</h2><p>La versió gratuïta permet desar fins a <strong>80 avaluacions noves al mes</strong> (tests i rúbriques). El comptador es reinicia l'1 de cada mes. En arribar al límit pots seguir veient resultats, exportar i fer còpies de seguretat; només es bloqueja desar fulls escanejats nous.</p><p><strong>FullGrader Premium</strong> elimina aquest límit i desbloqueja la connexió amb Google Classroom (importar alumnes iniciant sessió amb Google i enviar notes), la creació de rúbriques noves, posar dos fulls per paper, personalitzar la icona de cada classe, fer servir més de dos models d’examen, posar el teu logotip, l’anàlisi de preguntes, l’evolució per criteris, els informes en PDF i la còpia de seguretat automàtica. Corregir tests i rúbriques ja creades, exportar notes, les còpies de seguretat i importar la llista d'alumnes des d'Excel o CSV continuen sent gratis.</p><h2>Subscripció, preu i renovació</h2><p>Premium és una subscripció <strong>anual amb renovació automàtica</strong>, amb <strong>7 dies de prova gratuïta</strong> per a qui no l'hagi usat abans. El preu, en la moneda del teu país, el mostra Google Play abans de confirmar la compra.</p><p>El pagament es carrega al teu compte de Google Play en acabar la prova i es renova cada any tret que cancel·lis almenys 24 hores abans que acabi el període en curs. Pots cancel·lar quan vulguis a Google Play (Menú → Pagaments i subscripcions → Subscripcions → FullGrader). Si cancel·les, conserves Premium fins al final del període ja pagat.</p><h2>Reemborsaments</h2><p>Les compres les processa Google Play, que gestiona els reemborsaments segons les seves pròpies normes. Pots demanar-los des de l'historial de comandes de Google Play. FullGrader no té accés a les teves dades de pagament.</p><h2>Les teves dades i la teva responsabilitat</h2><p>Les dades que introdueixes (classes, alumnes, notes, fotos) són teves i es queden al teu dispositiu. Ets responsable d'usar-les d'acord amb les normes de protecció de dades que t'afectin a tu i al teu centre, i de fer còpies de seguretat: si perds o reinstal·les el dispositiu sense còpia, la informació no es pot recuperar.</p><h2>Revisa sempre les notes</h2><p>La lectura automàtica dels fulls pot cometre errors (marques poc clares, mala llum, paper arrugat…). FullGrader és una ajuda: abans de donar una nota per definitiva, revisa el resultat. La decisió final sobre la qualificació és sempre del professor.</p><h2>Ús acceptable</h2><p>Usa l'app només per a fins lícits i per a la teva activitat docent. No intentis saltar-te els límits de la versió gratuïta, ni alterar, copiar o revendre l'aplicació.</p><h2>Sense garanties i límit de responsabilitat</h2><p>FullGrader s'ofereix «tal qual». Fem tot el possible perquè funcioni bé, però no garantim que estigui lliure d'errors ni disponible sense interrupcions. En la mesura que permeti la llei, no responem de pèrdues de dades ni de perjudicis derivats de l'ús de l'app, i la nostra responsabilitat, si n'hi hagués, es limita a l'import pagat per Premium en els darrers 12 mesos. Això no afecta els drets que la llei et reconegui com a consumidor.</p><h2>Canvis en aquestes condicions</h2><p>Podem actualitzar aquestes condicions. Quan hi hagi canvis, es modificarà la data de dalt i, si són importants, s'avisarà a l'app. Els canvis de preu mai s'apliquen a un període ja pagat.</p><h2>Qui ofereix FullGrader</h2>\n<p>FullGrader el desenvolupa i l'ofereix <strong>Sergi Olivares</strong>, a Mataró (Barcelona, Espanya).</p>\n<h2>Contacte</h2><p>Per a qualsevol dubte, escriu a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Tots els drets reservats."}, "gl": {"label": "Galego", "title": "Condicións de uso", "updated": "Última actualización: 18 de outubro de 2026", "lead": "<strong>Estas condicións explican como funciona FullGrader e a súa subscrición opcional, FullGrader Premium.</strong> Ao usar a app aceptas o que segue. Se non estás de acordo, podes deixar de usala e desinstalala en calquera momento.", "body": "<h2>Que é FullGrader</h2><p>FullGrader é unha ferramenta para profesores: axuda a preparar follas de exame tipo test e rúbricas, e a corrixilas coa cámara do móbil. Todo se garda no teu dispositivo, tal e como explica a <a href=\"../privacy/\">política de privacidade</a>.</p><h2>Versión gratuíta e FullGrader Premium</h2><p>A versión gratuíta permite gardar ata <strong>80 avaliacións novas ao mes</strong> (tests e rúbricas). O contador reiníciase o día 1 de cada mes. Ao chegar ao límite podes seguir vendo resultados, exportar e facer copias de seguranza; só se bloquea gardar follas dixitalizadas novas.</p><p><strong>FullGrader Premium</strong> elimina ese límite e desbloquea a conexión con Google Classroom (importar alumnado iniciando sesión con Google e enviar notas), a creación de rúbricas novas, poñer dúas follas por papel, personalizar a icona de cada clase, usar máis de dous modelos de exame, poñer o teu logotipo, a análise de preguntas, a evolución por criterios, os informes en PDF e a copia de seguridade automática. Corrixir tests e rúbricas xa creadas, exportar notas, as copias de seguridade e importar a lista de alumnado desde Excel ou CSV seguen sendo gratis.</p><h2>Subscrición, prezo e renovación</h2><p>Premium é unha subscrición <strong>anual con renovación automática</strong>, con <strong>7 días de proba gratuíta</strong> para quen non a usase antes. O prezo, na moeda do teu país, móstrao Google Play antes de confirmar a compra.</p><p>O pagamento cárgase na túa conta de Google Play ao rematar a proba e renóvase cada ano salvo que canceles polo menos 24 horas antes de que remate o período en curso. Podes cancelar cando queiras en Google Play (Menú → Pagamentos e subscricións → Subscricións → FullGrader). Se cancelas, conservas Premium ata o final do período xa pagado.</p><h2>Reembolsos</h2><p>As compras procésaas Google Play, que xestiona os reembolsos segundo as súas propias normas. Podes pedilos desde o historial de pedidos de Google Play. FullGrader non ten acceso aos teus datos de pagamento.</p><h2>Os teus datos e a túa responsabilidade</h2><p>Os datos que introduces (clases, alumnado, notas, fotos) son teus e quedan no teu dispositivo. Es responsable de usalos conforme ás normas de protección de datos que che apliquen a ti e ao teu centro, e de facer copias de seguranza: se perdes ou reinstalas o dispositivo sen copia, a información non se pode recuperar.</p><h2>Revisa sempre as notas</h2><p>A lectura automática das follas pode cometer erros (marcas pouco claras, mala luz, papel engurrado…). FullGrader é unha axuda: antes de dar unha nota por definitiva, revisa o resultado. A decisión final sobre a cualificación é sempre do profesor.</p><h2>Uso aceptable</h2><p>Usa a app só para fins lícitos e para a túa actividade docente. Non intentes saltar os límites da versión gratuíta, nin alterar, copiar ou revender a aplicación.</p><h2>Sen garantías e límite de responsabilidade</h2><p>FullGrader ofrécese «tal cal». Facemos o posible para que funcione ben, pero non garantimos que estea libre de erros nin dispoñible sen interrupcións. Na medida que permita a lei, non respondemos de perdas de datos nin de prexuízos derivados do uso da app, e a nosa responsabilidade, se a houbese, limítase ao importe pagado por Premium nos últimos 12 meses. Isto non afecta aos dereitos que a lei che recoñeza como consumidor.</p><h2>Cambios nestas condicións</h2><p>Podemos actualizar estas condicións. Cando haxa cambios, modificarase a data de arriba e, se son importantes, avisarase na app. Os cambios de prezo nunca se aplican a un período xa pagado.</p><h2>Quen ofrece FullGrader</h2>\n<p>FullGrader desenvólveo e ofréceo <strong>Sergi Olivares</strong>, en Mataró (Barcelona, España).</p>\n<h2>Contacto</h2><p>Para calquera dúbida, escribe a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Todos os dereitos reservados."}, "eu": {"label": "Euskara", "title": "Erabilera baldintzak", "updated": "Azken eguneratzea: 2026ko urriaren 18a", "lead": "<strong>Baldintza hauek FullGrader nola funtzionatzen duen eta haren aukerako harpidetza, FullGrader Premium, azaltzen dute.</strong> Aplikazioa erabiltzean, jarraian dagoena onartzen duzu. Ados ez bazaude, edozein unetan utzi eta desinstalatu dezakezu.", "body": "<h2>Zer da FullGrader</h2><p>FullGrader irakasleentzako tresna bat da: test motako azterketa-orriak eta errubrikak prestatzen eta mugikorraren kamerarekin zuzentzen laguntzen du. Dena zure gailuan gordetzen da, <a href=\"../privacy/\">pribatutasun-politikan</a> azaltzen den bezala.</p><h2>Doako bertsioa eta FullGrader Premium</h2><p>Doako bertsioak hilean <strong>80 ebaluazio berri</strong> arte gordetzen uzten du (testak eta errubrikak). Kontagailua hilabete bakoitzaren 1ean berrezartzen da. Mugara iristean emaitzak ikusten, esportatzen eta segurtasun-kopiak egiten jarraitu dezakezu; eskaneatutako orri berriak gordetzea soilik blokeatzen da.</p><p><strong>FullGrader Premium</strong>-ek muga hori kentzen du eta Google Classroom-ekiko konexioa desblokeatzen du (ikasleak Google-rekin saioa hasita inportatu eta notak bidali), errubrika berriak sortzea, paper bakoitzeko bi orri jartzea, klase bakoitzaren ikonoa pertsonalizatzea, bi azterketa-eredu baino gehiago erabiltzea, zure logotipoa jartzea, galderen azterketa, irizpideen araberako bilakaera, PDF txostenak eta segurtasun-kopia automatikoa. Testak eta sortutako errubrikak zuzentzea, notak esportatzea, babeskopiak eta ikasleen zerrenda Excel edo CSV fitxategi batetik inportatzea doakoak izaten jarraitzen dute.</p><h2>Harpidetza, prezioa eta berritzea</h2><p>Premium <strong>urteko harpidetza</strong> da, <strong>berritze automatikoarekin</strong>, eta <strong>7 eguneko doako proba</strong> du lehen aldiz erabiltzen duenarentzat. Prezioa, zure herrialdeko monetan, Google Play-k erakusten du erosketa baieztatu aurretik.</p><p>Ordainketa zure Google Play kontuan kargatzen da proba amaitzean eta urtero berritzen da, indarrean dagoen aldia amaitu baino 24 ordu lehenago gutxienez ezeztatzen ez baduzu. Nahi duzunean ezeztatu dezakezu Google Play-n (Menua → Ordainketak eta harpidetzak → Harpidetzak → FullGrader). Ezeztatzen baduzu, Premium duzu ordaindutako aldia amaitu arte.</p><h2>Itzulketak</h2><p>Erosketak Google Play-k prozesatzen ditu, eta berak kudeatzen ditu itzulketak bere arauen arabera. Google Play-ko eskaera-historialetik eska ditzakezu. FullGraderrek ez du zure ordainketa-daturik eskuratzen.</p><h2>Zure datuak eta zure erantzukizuna</h2><p>Sartzen dituzun datuak (klaseak, ikasleak, notak, argazkiak) zureak dira eta zure gailuan geratzen dira. Zuri eta zure ikastetxeari aplikatzen zaizkien datu-babeserako arauen arabera erabiltzeko eta segurtasun-kopiak egiteko erantzulea zara: gailua galdu edo berrinstalatzen baduzu kopiarik gabe, informazioa ezin da berreskuratu.</p><h2>Berrikusi beti notak</h2><p>Orrien irakurketa automatikoak akatsak izan ditzake (marka argi gabeak, argi txarra, paper zimurtua…). FullGrader laguntza bat da: nota behin betikotzat jo aurretik, berrikusi emaitza. Kalifikazioari buruzko azken erabakia beti irakaslearena da.</p><h2>Erabilera onargarria</h2><p>Erabili aplikazioa helburu legezkoetarako eta zure irakaskuntza-jardueraren barruan soilik. Ez saiatu doako bertsioaren mugak saihesten, ez aplikazioa aldatzen, kopiatzen edo birsaltzen.</p><h2>Bermerik gabe eta erantzukizun-muga</h2><p>FullGrader «dagoen bezala» eskaintzen da. Ondo funtzionatzeko ahalegin guztia egiten dugu, baina ez dugu bermatzen akatsik gabekoa izango denik, ezta etenik gabe eskuragarri egongo denik ere. Legeak onartzen duen neurrian, ez gara datu-galeren edo aplikazioaren erabileratik eratorritako kalteen erantzule, eta gure erantzukizuna, egonez gero, azken 12 hilabeteetan Premium-erako ordaindutako zenbatekora mugatzen da. Horrek ez ditu kaltetzen legeak kontsumitzaile gisa aitortzen dizkizun eskubideak.</p><h2>Baldintza hauen aldaketak</h2><p>Baldintza hauek eguneratu ditzakegu. Aldaketak daudenean goiko data aldatuko da, eta garrantzitsuak badira aplikazioan jakinaraziko da. Prezio-aldaketak ez zaizkio inoiz ordaindutako aldi bati aplikatzen.</p><h2>Nork eskaintzen du FullGrader</h2>\n<p>FullGrader <strong>Sergi Olivares</strong>-ek garatzen eta eskaintzen du, Mataró-n (Bartzelona, Espainia).</p>\n<h2>Kontaktua</h2><p>Edozein zalantzarako, idatzi helbide honetara: <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Eskubide guztiak erreserbatuta."}, "en": {"label": "English", "title": "Terms of use", "updated": "Last updated: October 18, 2026", "lead": "<strong>These terms explain how FullGrader and its optional subscription, FullGrader Premium, work.</strong> By using the app you accept what follows. If you do not agree, you can stop using it and uninstall it at any time.", "body": "<h2>What FullGrader is</h2><p>FullGrader is a tool for teachers: it helps prepare multiple-choice answer sheets and rubrics, and grade them with the phone camera. Everything is stored on your device, as explained in the <a href=\"../privacy/\">privacy policy</a>.</p><h2>Free version and FullGrader Premium</h2><p>The free version lets you save up to <strong>80 new evaluations per month</strong> (tests and rubrics). The counter resets on the 1st of each month. When you reach the limit you can still view results, export and make backups; only saving new scanned sheets is blocked.</p><p><strong>FullGrader Premium</strong> removes that limit and unlocks the Google Classroom connection (importing students by signing in with Google, and sending grades), creating new rubrics, two sheets per paper, custom class icons, more than two exam models, your own logo, question analysis, progress by criterion, PDF reports and automatic backup. Grading tests and existing rubrics, exporting grades, backups and importing your student list from Excel or CSV remain free.</p><h2>Subscription, price and renewal</h2><p>Premium is an <strong>annual subscription that renews automatically</strong>, with a <strong>7-day free trial</strong> for anyone who has not used it before. The price, in your country's currency, is shown by Google Play before you confirm the purchase.</p><p>Payment is charged to your Google Play account when the trial ends and renews every year unless you cancel at least 24 hours before the current period ends. You can cancel at any time in Google Play (Menu → Payments &amp; subscriptions → Subscriptions → FullGrader). If you cancel, you keep Premium until the end of the period you have already paid for.</p><h2>Refunds</h2><p>Purchases are processed by Google Play, which handles refunds under its own rules. You can request one from your Google Play order history. FullGrader has no access to your payment details.</p><h2>Your data and your responsibility</h2><p>The data you enter (classes, students, grades, photos) is yours and stays on your device. You are responsible for using it in line with the data protection rules that apply to you and your school, and for making backups: if you lose or reinstall your device without a backup, the information cannot be recovered.</p><h2>Always check the grades</h2><p>Automatic reading of the sheets can make mistakes (unclear marks, poor lighting, creased paper…). FullGrader is an aid: review the result before treating a grade as final. The final decision on a grade is always the teacher's.</p><h2>Acceptable use</h2><p>Use the app only for lawful purposes and for your teaching work. Do not try to get around the free-version limits, or to alter, copy or resell the app.</p><h2>No warranty and limit of liability</h2><p>FullGrader is provided \"as is\". We do our best to make it work well, but we do not guarantee that it is error-free or always available. To the extent the law allows, we are not liable for data loss or damages arising from using the app, and our liability, if any, is limited to the amount paid for Premium in the last 12 months. This does not affect the rights you have as a consumer under the law.</p><h2>Changes to these terms</h2><p>We may update these terms. When they change, the date above will be updated and, if the changes are important, you will be told in the app. Price changes never apply to a period you have already paid for.</p><h2>Who offers FullGrader</h2>\n<p>FullGrader is developed and offered by <strong>Sergi Olivares</strong>, in Mataró (Barcelona, Spain).</p>\n<h2>Contact</h2><p>If you have any questions, write to <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. All rights reserved."}, "de": {"label": "Deutsch", "title": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 18. Oktober 2026", "lead": "<strong>Diese Bedingungen erläutern, wie FullGrader und das optionale Abo FullGrader Premium funktionieren.</strong> Mit der Nutzung der App akzeptieren Sie die folgenden Bedingungen. Wenn Sie nicht einverstanden sind, können Sie die Nutzung jederzeit beenden und die App deinstallieren.", "body": "<h2>Was FullGrader ist</h2><p>FullGrader ist ein Werkzeug für Lehrkräfte: Es hilft dabei, Multiple-Choice-Prüfungsbögen und Bewertungsraster zu erstellen und sie mit der Handykamera zu korrigieren. Alles wird auf Ihrem Gerät gespeichert, wie in der <a href=\"../privacy/\">Datenschutzerklärung</a> beschrieben.</p><h2>Kostenlose Version und FullGrader Premium</h2><p>Mit der kostenlosen Version können Sie bis zu <strong>80 neue Bewertungen pro Monat</strong> speichern (Tests und Bewertungsraster). Der Zähler wird am 1. jedes Monats zurückgesetzt. Ist die Grenze erreicht, können Sie weiterhin Ergebnisse ansehen, exportieren und Sicherungen erstellen; gesperrt wird nur das Speichern neu gescannter Bögen.</p><p><strong>FullGrader Premium</strong> hebt diese Grenze auf und schaltet folgende Funktionen frei: die Verbindung zu Google Classroom (Schülerinnen und Schüler per Google-Anmeldung importieren und Noten senden), das Erstellen neuer Bewertungsraster, zwei Bögen pro Seite, ein eigenes Symbol für jede Klasse, mehr als zwei Prüfungsversionen, ein eigenes Logo, die Fragenanalyse, den Fortschritt nach Kriterium, die PDF-Berichte und die automatische Sicherung. Das Korrigieren von Tests und bereits erstellten Bewertungsrastern, der Export von Noten, Sicherungen sowie der Import der Schülerliste aus Excel oder CSV bleiben kostenlos.</p><h2>Abo, Preis und Verlängerung</h2><p>Premium ist ein <strong>Jahresabo mit automatischer Verlängerung</strong> und einem <strong>kostenlosen Testzeitraum von 7 Tagen</strong> für alle, die es noch nicht genutzt haben. Den Preis in der Währung Ihres Landes zeigt Google Play an, bevor Sie den Kauf bestätigen.</p><p>Die Zahlung wird nach Ablauf des Testzeitraums Ihrem Google-Play-Konto belastet, und das Abo verlängert sich jedes Jahr, sofern Sie nicht spätestens 24 Stunden vor Ende des laufenden Zeitraums kündigen. Sie können jederzeit in Google Play kündigen (Menü → Zahlungen und Abos → Abos → FullGrader). Nach einer Kündigung behalten Sie Premium bis zum Ende des bereits bezahlten Zeitraums.</p><h2>Erstattungen</h2><p>Käufe werden von Google Play abgewickelt, das Erstattungen nach seinen eigenen Richtlinien bearbeitet. Sie können sie über Ihren Bestellverlauf in Google Play beantragen. FullGrader hat keinen Zugriff auf Ihre Zahlungsdaten.</p><h2>Ihre Daten und Ihre Verantwortung</h2><p>Die Daten, die Sie eingeben (Klassen, Schülerinnen und Schüler, Noten, Fotos), gehören Ihnen und verbleiben auf Ihrem Gerät. Sie sind dafür verantwortlich, sie im Einklang mit den für Sie und Ihre Schule geltenden Datenschutzvorschriften zu verwenden und Sicherungen anzulegen: Wenn Sie das Gerät verlieren oder die App ohne Sicherung neu installieren, können die Informationen nicht wiederhergestellt werden.</p><h2>Prüfen Sie die Noten immer</h2><p>Die automatische Erkennung der Bögen kann Fehler machen (undeutliche Markierungen, schlechtes Licht, zerknittertes Papier …). FullGrader ist ein Hilfsmittel: Prüfen Sie das Ergebnis, bevor Sie eine Note als endgültig betrachten. Die abschließende Entscheidung über die Bewertung liegt immer bei der Lehrkraft.</p><h2>Zulässige Nutzung</h2><p>Verwenden Sie die App nur für rechtmäßige Zwecke und für Ihre Unterrichtstätigkeit. Versuchen Sie nicht, die Grenzen der kostenlosen Version zu umgehen oder die App zu verändern, zu kopieren oder weiterzuverkaufen.</p><h2>Keine Gewährleistung und Haftungsbeschränkung</h2><p>FullGrader wird „wie besehen“ bereitgestellt. Wir tun unser Möglichstes, damit die App gut funktioniert, garantieren jedoch nicht, dass sie fehlerfrei oder ohne Unterbrechungen verfügbar ist. Soweit gesetzlich zulässig, haften wir nicht für Datenverluste oder Schäden, die aus der Nutzung der App entstehen, und unsere Haftung, sofern eine besteht, ist auf den Betrag begrenzt, den Sie in den letzten 12 Monaten für Premium bezahlt haben. Ihre gesetzlichen Rechte als Verbraucherin oder Verbraucher bleiben hiervon unberührt.</p><h2>Änderungen dieser Bedingungen</h2><p>Wir können diese Bedingungen aktualisieren. Bei Änderungen wird das Datum oben angepasst und, wenn sie wesentlich sind, in der App darauf hingewiesen. Preisänderungen gelten niemals für einen bereits bezahlten Zeitraum.</p><h2>Anbieter</h2>\n<p>FullGrader wird von <strong>Sergi Olivares</strong> in Mataró (Barcelona, Spanien) entwickelt und angeboten.</p>\n<h2>Kontakt</h2><p>Bei Fragen schreiben Sie bitte an <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Alle Rechte vorbehalten."}, "fr": {"label": "Français", "title": "Conditions d’utilisation", "updated": "Dernière mise à jour : 18 octobre 2026", "lead": "<strong>Les présentes conditions expliquent le fonctionnement de FullGrader et de son abonnement facultatif, FullGrader Premium.</strong> En utilisant l’application, vous acceptez ce qui suit. Si vous n’êtes pas d’accord, vous pouvez cesser de l’utiliser et la désinstaller à tout moment.", "body": "<h2>Qu’est-ce que FullGrader</h2><p>FullGrader est un outil destiné aux enseignants : il aide à préparer des feuilles d’examen de type QCM et des grilles d’évaluation, et à les corriger avec l’appareil photo du téléphone. Tout est enregistré sur votre appareil, comme l’explique la <a href=\"../privacy/\">politique de confidentialité</a>.</p><h2>Version gratuite et FullGrader Premium</h2><p>La version gratuite permet d’enregistrer jusqu’à <strong>80 nouvelles évaluations par mois</strong> (QCM et grilles d’évaluation). Le compteur repart à zéro le 1er de chaque mois. Une fois la limite atteinte, vous pouvez continuer à consulter les résultats, exporter et faire des sauvegardes ; seul l’enregistrement de nouvelles feuilles scannées est bloqué.</p><p><strong>FullGrader Premium</strong> supprime cette limite et débloque la connexion à Google Classroom (importer des élèves en se connectant avec Google et envoyer des notes), la création de nouvelles grilles d’évaluation, l’impression de deux feuilles par page, la personnalisation de l’icône de chaque classe, l’utilisation de plus de deux versions d’examen, l’ajout de votre logo, l’analyse des questions, le progrès par critère, les rapports PDF et la sauvegarde automatique. Corriger des QCM et des grilles déjà créées, exporter les notes, les sauvegardes et l’import de la liste d’élèves depuis Excel ou CSV restent gratuits.</p><h2>Abonnement, prix et renouvellement</h2><p>Premium est un abonnement <strong>annuel à renouvellement automatique</strong>, avec <strong>7 jours d’essai gratuit</strong> pour les personnes qui n’en ont jamais bénéficié. Le prix, dans la devise de votre pays, est affiché par Google Play avant la confirmation de l’achat.</p><p>Le paiement est débité de votre compte Google Play à la fin de l’essai et se renouvelle chaque année, sauf si vous résiliez au moins 24 heures avant la fin de la période en cours. Vous pouvez résilier à tout moment dans Google Play (Menu → Paiements et abonnements → Abonnements → FullGrader). Si vous résiliez, vous conservez Premium jusqu’à la fin de la période déjà payée.</p><h2>Remboursements</h2><p>Les achats sont traités par Google Play, qui gère les remboursements selon ses propres règles. Vous pouvez les demander depuis votre historique de commandes Google Play. FullGrader n’a pas accès à vos données de paiement.</p><h2>Vos données et votre responsabilité</h2><p>Les données que vous saisissez (classes, élèves, notes, photos) vous appartiennent et restent sur votre appareil. Il vous incombe de les utiliser conformément aux règles de protection des données qui s’appliquent à vous et à votre établissement, et de faire des sauvegardes : si vous perdez ou réinstallez l’appareil sans sauvegarde, les informations ne peuvent pas être récupérées.</p><h2>Vérifiez toujours les notes</h2><p>La lecture automatique des feuilles peut commettre des erreurs (marques peu nettes, mauvais éclairage, papier froissé…). FullGrader est une aide : avant de considérer une note comme définitive, vérifiez le résultat. La décision finale sur la note appartient toujours à l’enseignant.</p><h2>Utilisation acceptable</h2><p>Utilisez l’application uniquement à des fins licites et dans le cadre de votre activité d’enseignement. N’essayez pas de contourner les limites de la version gratuite, ni de modifier, copier ou revendre l’application.</p><h2>Absence de garantie et limitation de responsabilité</h2><p>FullGrader est fourni « en l’état ». Nous faisons notre possible pour qu’il fonctionne correctement, mais nous ne garantissons pas qu’il soit exempt d’erreurs ni disponible sans interruption. Dans la mesure permise par la loi, nous ne sommes pas responsables des pertes de données ni des préjudices découlant de l’utilisation de l’application, et notre responsabilité, le cas échéant, est limitée au montant payé pour Premium au cours des 12 derniers mois. Cela n’affecte pas les droits que la loi vous reconnaît en tant que consommateur.</p><h2>Modifications des présentes conditions</h2><p>Nous pouvons mettre à jour ces conditions. En cas de modification, la date indiquée en haut sera mise à jour et, si les changements sont importants, vous en serez informé dans l’application. Les changements de prix ne s’appliquent jamais à une période déjà payée.</p><h2>Qui propose FullGrader</h2>\n<p>FullGrader est développé et proposé par <strong>Sergi Olivares</strong>, à Mataró (Barcelone, Espagne).</p>\n<h2>Contact</h2><p>Pour toute question, écrivez à <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Tous droits réservés."}, "it": {"label": "Italiano", "title": "Condizioni d’uso", "updated": "Ultimo aggiornamento: 18 ottobre 2026", "lead": "<strong>Le presenti condizioni spiegano come funzionano FullGrader e il suo abbonamento facoltativo, FullGrader Premium.</strong> Utilizzando l’app accetti quanto segue. Se non sei d’accordo, puoi smettere di usarla e disinstallarla in qualsiasi momento.", "body": "<h2>Che cos’è FullGrader</h2><p>FullGrader è uno strumento per docenti: aiuta a preparare fogli per verifiche a risposta multipla e rubriche, e a correggerli con la fotocamera del telefono. Tutto viene salvato sul tuo dispositivo, come spiegato nell’<a href=\"../privacy/\">informativa sulla privacy</a>.</p><h2>Versione gratuita e FullGrader Premium</h2><p>La versione gratuita consente di salvare fino a <strong>80 nuove valutazioni al mese</strong> (test e rubriche). Il contatore si azzera il giorno 1 di ogni mese. Al raggiungimento del limite puoi continuare a consultare i risultati, esportare e fare backup; viene bloccato soltanto il salvataggio di nuovi fogli scansionati.</p><p><strong>FullGrader Premium</strong> elimina tale limite e sblocca la connessione a Google Classroom (importare gli studenti accedendo con Google e inviare i voti), la creazione di nuove rubriche, la stampa di due fogli per pagina, la personalizzazione dell’icona di ogni classe, l’uso di più di due versioni della verifica, l’inserimento del tuo logo, l’analisi delle domande, i progressi per criterio, i report in PDF e il backup automatico. Correggere test e rubriche già create, esportare i voti, i backup e importare l’elenco degli studenti da Excel o CSV restano gratuiti.</p><h2>Abbonamento, prezzo e rinnovo</h2><p>Premium è un abbonamento <strong>annuale con rinnovo automatico</strong>, con <strong>7 giorni di prova gratuita</strong> per chi non l’ha mai utilizzato in precedenza. Il prezzo, nella valuta del tuo Paese, viene indicato da Google Play prima della conferma dell’acquisto.</p><p>Il pagamento viene addebitato sul tuo account Google Play al termine della prova e si rinnova ogni anno, salvo disdetta almeno 24 ore prima della fine del periodo in corso. Puoi disdire in qualsiasi momento su Google Play (Menu → Pagamenti e abbonamenti → Abbonamenti → FullGrader). In caso di disdetta, mantieni Premium fino alla fine del periodo già pagato.</p><h2>Rimborsi</h2><p>Gli acquisti sono elaborati da Google Play, che gestisce i rimborsi secondo le proprie regole. Puoi richiederli dalla cronologia degli ordini di Google Play. FullGrader non ha accesso ai tuoi dati di pagamento.</p><h2>I tuoi dati e la tua responsabilità</h2><p>I dati che inserisci (classi, studenti, voti, foto) sono tuoi e restano sul tuo dispositivo. Sei responsabile del loro utilizzo in conformità alla normativa sulla protezione dei dati personali applicabile a te e alla tua scuola, nonché dell’esecuzione dei backup: se perdi o reinstalli il dispositivo senza un backup, le informazioni non possono essere recuperate.</p><h2>Controlla sempre i voti</h2><p>La lettura automatica dei fogli può commettere errori (segni poco chiari, luce scarsa, carta stropicciata…). FullGrader è un aiuto: prima di considerare definitivo un voto, controlla il risultato. La decisione finale sulla valutazione spetta sempre al docente.</p><h2>Uso consentito</h2><p>Utilizza l’app esclusivamente per finalità lecite e per la tua attività didattica. Non tentare di aggirare i limiti della versione gratuita, né di alterare, copiare o rivendere l’applicazione.</p><h2>Esclusione di garanzie e limitazione di responsabilità</h2><p>FullGrader è fornito «così com’è». Facciamo il possibile affinché funzioni correttamente, ma non garantiamo che sia privo di errori né disponibile senza interruzioni. Nei limiti consentiti dalla legge, non rispondiamo di perdite di dati né di danni derivanti dall’uso dell’app, e la nostra responsabilità, ove sussistente, è limitata all’importo pagato per Premium negli ultimi 12 mesi. Ciò non pregiudica i diritti che la legge ti riconosce in qualità di consumatore.</p><h2>Modifiche alle presenti condizioni</h2><p>Possiamo aggiornare le presenti condizioni. In caso di modifiche, la data indicata in alto verrà aggiornata e, se si tratta di modifiche rilevanti, ne verrà dato avviso nell’app. Le variazioni di prezzo non si applicano mai a un periodo già pagato.</p><h2>Chi offre FullGrader</h2>\n<p>FullGrader è sviluppato e offerto da <strong>Sergi Olivares</strong>, a Mataró (Barcellona, Spagna).</p>\n<h2>Contatti</h2><p>Per qualsiasi domanda, scrivi a <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Tutti i diritti riservati."}, "pt": {"label": "Português", "title": "Termos de utilização", "updated": "Última atualização: 18 de outubro de 2026", "lead": "<strong>Estes termos explicam como funciona o FullGrader e a sua subscrição opcional, o FullGrader Premium.</strong> Ao usar a aplicação, aceita o que se segue. Se não concordar, pode deixar de a usar e desinstalá-la em qualquer momento.", "body": "<h2>O que é o FullGrader</h2><p>O FullGrader é uma ferramenta para professores: ajuda a preparar folhas de teste de escolha múltipla e rubricas, e a corrigi-las com a câmara do telemóvel. Tudo fica guardado no seu dispositivo, tal como explica a <a href=\"../privacy/\">política de privacidade</a>.</p><h2>Versão gratuita e FullGrader Premium</h2><p>A versão gratuita permite guardar até <strong>80 avaliações novas por mês</strong> (testes e rubricas). O contador recomeça no dia 1 de cada mês. Ao atingir o limite, pode continuar a ver resultados, exportar e fazer cópias de segurança; só fica bloqueado guardar novas folhas digitalizadas.</p><p>O <strong>FullGrader Premium</strong> elimina esse limite e desbloqueia a ligação ao Google Classroom (importar alunos iniciando sessão com a Google e enviar notas), a criação de novas rubricas, a impressão de duas folhas por página, a personalização do ícone de cada turma, a utilização de mais de duas versões do teste, a colocação do seu logótipo, a análise das perguntas, a evolução por critérios, os relatórios em PDF e a cópia de segurança automática. Corrigir testes e rubricas já criadas, exportar notas, as cópias de segurança e importar a lista de alunos de Excel ou CSV continuam a ser gratuitos.</p><h2>Subscrição, preço e renovação</h2><p>O Premium é uma subscrição <strong>anual com renovação automática</strong>, com <strong>7 dias de avaliação gratuita</strong> para quem ainda não a tenha utilizado. O preço, na moeda do seu país, é apresentado pelo Google Play antes de confirmar a compra.</p><p>O pagamento é cobrado na sua conta Google Play no fim do período de avaliação e é renovado todos os anos, a menos que cancele pelo menos 24 horas antes do fim do período em curso. Pode cancelar quando quiser no Google Play (Menu → Pagamentos e subscrições → Subscrições → FullGrader). Se cancelar, mantém o Premium até ao fim do período já pago.</p><h2>Reembolsos</h2><p>As compras são processadas pelo Google Play, que gere os reembolsos de acordo com as suas próprias regras. Pode pedi-los a partir do seu histórico de encomendas do Google Play. O FullGrader não tem acesso aos seus dados de pagamento.</p><h2>Os seus dados e a sua responsabilidade</h2><p>Os dados que introduz (turmas, alunos, notas, fotografias) são seus e ficam no seu dispositivo. É responsável por utilizá-los em conformidade com as normas de proteção de dados aplicáveis a si e à sua escola, bem como por fazer cópias de segurança: se perder ou reinstalar o dispositivo sem cópia, as informações não podem ser recuperadas.</p><h2>Reveja sempre as notas</h2><p>A leitura automática das folhas pode cometer erros (marcas pouco nítidas, má iluminação, papel amarrotado…). O FullGrader é uma ajuda: antes de dar uma nota como definitiva, reveja o resultado. A decisão final sobre a classificação cabe sempre ao professor.</p><h2>Utilização aceitável</h2><p>Use a aplicação apenas para fins lícitos e para a sua atividade docente. Não tente contornar os limites da versão gratuita, nem alterar, copiar ou revender a aplicação.</p><h2>Ausência de garantias e limitação de responsabilidade</h2><p>O FullGrader é disponibilizado «tal como está». Fazemos o possível para que funcione bem, mas não garantimos que esteja isento de erros nem disponível sem interrupções. Na medida em que a lei o permita, não respondemos por perdas de dados nem por prejuízos decorrentes da utilização da aplicação, e a nossa responsabilidade, caso exista, limita-se ao montante pago pelo Premium nos últimos 12 meses. Isto não afeta os direitos que a lei lhe reconheça enquanto consumidor.</p><h2>Alterações a estes termos</h2><p>Podemos atualizar estes termos. Quando houver alterações, a data indicada acima será modificada e, se forem importantes, serão comunicadas na aplicação. As alterações de preço nunca se aplicam a um período já pago.</p><h2>Quem disponibiliza o FullGrader</h2>\n<p>O FullGrader é desenvolvido e disponibilizado por <strong>Sergi Olivares</strong>, em Mataró (Barcelona, Espanha).</p>\n<h2>Contacto</h2><p>Para qualquer dúvida, escreva para <a href=\"mailto:regixstudio.dev@gmail.com\">regixstudio.dev@gmail.com</a>.</p>", "footer": "© 2026 FullGrader. Todos os direitos reservados."}};
  var PAGEWORD = {"es": "Condiciones", "ca": "Condicions", "gl": "Condicións", "eu": "Baldintzak", "en": "Terms", "de": "Bedingungen", "fr": "Conditions", "it": "Condizioni", "pt": "Termos"};
  var ORDER = ["es", "ca", "gl", "eu", "en", "de", "fr", "it", "pt"];

  function pickInitialLang() {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get('lang');
    if (fromUrl && DATA[fromUrl]) return fromUrl;
    try {
      var saved = localStorage.getItem('fullgrader-home-lang');
      if (saved && DATA[saved]) return saved;
    } catch (e) {}
    var nav = (navigator.language || 'es').toLowerCase();
    for (var i = 0; i < ORDER.length; i++) {
      if (nav.indexOf(ORDER[i]) === 0) return ORDER[i];
    }
    return 'es';
  }

  function render(lang) {
    var d = DATA[lang];
    if (!d) return;
    document.documentElement.lang = lang;
    document.title = d.title + ' · FullGrader';
    document.getElementById('pTitle').textContent = d.title;
    document.getElementById('pUpdated').textContent = d.updated;
    document.getElementById('pLead').innerHTML = d.lead;
    document.getElementById('pBody').innerHTML = d.body;
    document.getElementById('pFooter').innerHTML = '<p>' + d.footer + '</p>';
    var pw = document.querySelector('[data-pageword]');
    if (pw) pw.textContent = PAGEWORD[lang];
    FGBar.sync(lang);
    try { localStorage.setItem('fullgrader-home-lang', lang); } catch (e) {}
  }

  FGBar.onChange(render);

  render(pickInitialLang());
</script>
